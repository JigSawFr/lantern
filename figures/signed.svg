<?xml version="1.0" encoding="UTF-8"?>
<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470" width="540" height="470" role="img" aria-label="A signed request, and how it is refused"><title>A signed request, and how it is refused</title><style>svg{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12.5px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}.dg-bg{fill:#0e1a33}text{fill:#e8eef7}.dg-head{fill:#a9b6cc}.dg-life{stroke:#22324f;stroke-width:1.5;stroke-dasharray:3 5}.dg-actor{fill:#0b1424;stroke:#00ffcc;stroke-width:1.5}.dg-actortext{font-weight:600}.dg-msg{stroke:#a9b6cc;stroke-width:1.5;fill:none}.dg-dash{stroke-dasharray:5 4}.dg-badline{stroke:#ff6b81}.dg-halo{paint-order:stroke;stroke:#0e1a33;stroke-width:4px;stroke-linejoin:round}.dg-note{fill:#0b1424;stroke:#6f7e9c;stroke-width:1}text.dg-notetext{fill:#a9b6cc}.dg-sep{stroke:#22324f;stroke-width:1;stroke-dasharray:2 4}.dg-sepbg{fill:#0b1424;stroke:#33bbff;stroke-width:1}text.dg-septext{fill:#33bbff;font-weight:600}.dg-node{fill:#0b1424;stroke:#22324f;stroke-width:1.5}.dg-dev{stroke:#00ffcc}.dg-srv{stroke:#33bbff}.dg-key{stroke:#8a5cff}.dg-bad{stroke:#ff6b81}.dg-zone{fill:none;stroke:#22324f;stroke-width:1.5}text.dg-zonetext{fill:#00ffcc;font-weight:600}text.dg-ref{fill:#6f7e9c;font-size:11px}</style><defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-head" d="M0 0L10 5L0 10z"/></marker></defs><rect class="dg-bg" width="540" height="470" rx="12"/><line class="dg-life" x1="80" y1="38" x2="80" y2="464"/><line class="dg-life" x1="460" y1="38" x2="460" y2="464"/><rect class="dg-actor" x="45" y="6" width="69" height="30" rx="8"/><text class="dg-actortext" x="80" y="26" text-anchor="middle"><tspan x="80" dy="0">Client</tspan></text><rect class="dg-actor" x="425" y="6" width="69" height="30" rx="8"/><text class="dg-actortext" x="460" y="26" text-anchor="middle"><tspan x="460" dy="0">Server</tspan></text><g class="dg-step" data-step="0"><rect class="dg-note" x="4" y="56" width="325" height="42" rx="8"/><text class="dg-notetext " x="166" y="74" text-anchor="middle"><tspan x="166" dy="0">At pairing: makes an Ed25519 key pair,</tspan><tspan x="166" dy="15">sends the public key, keeps the private one</tspan></text></g><g class="dg-step" data-step="1"><line class="dg-msg" x1="83" y1="174" x2="457" y2="174" marker-end="url(#dg-arrow)"/><text class="dg-label mono" x="270" y="119" text-anchor="middle"><tspan x="270" dy="0">GET /v1/apps?page_size=50</tspan><tspan x="270" dy="15">Authorization: Bearer et_…</tspan><tspan x="270" dy="15">Signature-Input: lantern=(…);created, nonce, keyid, alg</tspan><tspan x="270" dy="15">Signature: lantern=:…:</tspan></text></g><g class="dg-step" data-step="2"><rect class="dg-note" x="232" y="188" width="304" height="57" rx="8"/><text class="dg-notetext " x="384" y="206" text-anchor="middle"><tspan x="384" dy="0">Checks, in this order: present,</tspan><tspan x="384" dy="15">form and signature, created within skew,</tspan><tspan x="384" dy="15">nonce not seen</tspan></text></g><g class="dg-step" data-step="3"><line class="dg-msg dg-dash" x1="457" y1="276" x2="83" y2="276" marker-end="url(#dg-arrow)"/><text class="dg-label mono" x="270" y="266" text-anchor="middle"><tspan x="270" dy="0">200</tspan></text></g><g class="dg-step" data-step="4"><line class="dg-msg dg-dash" x1="457" y1="326" x2="83" y2="326" marker-end="url(#dg-arrow)"/><text class="dg-label mono" x="270" y="301" text-anchor="middle"><tspan x="270" dy="0">401 signature_required | signature_invalid</tspan><tspan x="270" dy="15">| signature_expired | signature_replayed</tspan></text></g><g class="dg-step" data-step="5"><rect class="dg-note" x="4" y="340" width="421" height="42" rx="8"/><text class="dg-notetext " x="215" y="358" text-anchor="middle"><tspan x="215" dy="0">signature_expired: takes the offset to the server&#x27;s Date,</tspan><tspan x="215" dy="15">signs again, once</tspan></text></g><g class="dg-step" data-step="6"><line class="dg-msg" x1="83" y1="413" x2="457" y2="413" marker-end="url(#dg-arrow)"/><text class="dg-label " x="270" y="403" text-anchor="middle"><tspan x="270" dy="0">The same request, signed again</tspan></text></g><g class="dg-step" data-step="7"><line class="dg-msg dg-dash" x1="457" y1="448" x2="83" y2="448" marker-end="url(#dg-arrow)"/><text class="dg-label mono" x="270" y="438" text-anchor="middle"><tspan x="270" dy="0">200</tspan></text></g></svg>
