<?xml version="1.0" encoding="UTF-8"?>
<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 473 792" width="473" height="792" role="img" aria-label="Backing up a save, and restoring it"><title>Backing up a save, and restoring it</title><style>svg{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12.5px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}.dg-bg{fill:#0e1a33}text{fill:#e8eef7}.dg-head{fill:#a9b6cc}.dg-life{stroke:#22324f;stroke-width:1.5;stroke-dasharray:3 5}.dg-actor{fill:#0b1424;stroke:#00ffcc;stroke-width:1.5}.dg-actortext{font-weight:600}.dg-msg{stroke:#a9b6cc;stroke-width:1.5;fill:none}.dg-dash{stroke-dasharray:5 4}.dg-badline{stroke:#ff6b81}.dg-halo{paint-order:stroke;stroke:#0e1a33;stroke-width:4px;stroke-linejoin:round}.dg-note{fill:#0b1424;stroke:#6f7e9c;stroke-width:1}text.dg-notetext{fill:#a9b6cc}.dg-sep{stroke:#22324f;stroke-width:1;stroke-dasharray:2 4}.dg-sepbg{fill:#0b1424;stroke:#33bbff;stroke-width:1}text.dg-septext{fill:#33bbff;font-weight:600}.dg-node{fill:#0b1424;stroke:#22324f;stroke-width:1.5}.dg-dev{stroke:#00ffcc}.dg-srv{stroke:#33bbff}.dg-key{stroke:#8a5cff}.dg-bad{stroke:#ff6b81}.dg-zone{fill:none;stroke:#22324f;stroke-width:1.5}text.dg-zonetext{fill:#00ffcc;font-weight:600}text.dg-ref{fill:#6f7e9c;font-size:11px}</style><defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-head" d="M0 0L10 5L0 10z"/></marker></defs><rect class="dg-bg" width="473" height="792" rx="12"/><line class="dg-life" x1="80" y1="38" x2="80" y2="786"/><line class="dg-life" x1="393" y1="38" x2="393" y2="786"/><rect class="dg-actor" x="45" y="6" width="69" height="30" rx="8"/><text class="dg-actortext" x="80" y="26" text-anchor="middle"><tspan x="80" dy="0">Device</tspan></text><rect class="dg-actor" x="358" y="6" width="69" height="30" rx="8"/><text class="dg-actortext" x="393" y="26" text-anchor="middle"><tspan x="393" dy="0">Server</tspan></text><g class="dg-step" data-step="0"><line class="dg-sep" x1="12" y1="72" x2="461" y2="72"/><rect class="dg-sepbg" x="198" y="60" width="76" height="24" rx="12"/><text class="dg-septext " x="237" y="76" text-anchor="middle"><tspan x="237" dy="0">Back up</tspan></text></g><g class="dg-step" data-step="1"><line class="dg-msg" x1="83" y1="128" x2="390" y2="128" marker-end="url(#dg-arrow)"/><text class="dg-label mono" x="237" y="103" text-anchor="middle"><tspan x="237" dy="0">POST /v1/saves/{title_id}</tspan><tspan x="237" dy="15">Content-Digest: sha-256=:…:</tspan></text></g><g class="dg-step" data-step="2"><line class="dg-msg dg-dash" x1="390" y1="163" x2="83" y2="163" marker-end="url(#dg-arrow)"/><text class="dg-label mono" x="237" y="153" text-anchor="middle"><tspan x="237" dy="0">201 save entry (save_id, sha256)</tspan></text></g><g class="dg-step" data-step="3"><rect class="dg-note" x="52" y="177" width="369" height="42" rx="8"/><text class="dg-notetext " x="237" y="195" text-anchor="middle"><tspan x="237" dy="0">Larger than limits.save_body:</tspan><tspan x="237" dy="15">resumable upload (§ 9.3)</tspan></text></g><g class="dg-step" data-step="4"><line class="dg-msg" x1="83" y1="265" x2="390" y2="265" marker-end="url(#dg-arrow)"/><text class="dg-label mono" x="237" y="240" text-anchor="middle"><tspan x="237" dy="0">POST /v1/saves/{title_id}/uploads</tspan><tspan x="237" dy="15">{size, sha256, kind}</tspan></text></g><g class="dg-step" data-step="5"><line class="dg-msg dg-dash" x1="390" y1="300" x2="83" y2="300" marker-end="url(#dg-arrow)"/><text class="dg-label mono" x="237" y="290" text-anchor="middle"><tspan x="237" dy="0">201 {upload, chunk_size, offset}</tspan></text></g><g class="dg-step" data-step="6"><line class="dg-msg" x1="83" y1="335" x2="390" y2="335" marker-end="url(#dg-arrow)"/><text class="dg-label mono" x="237" y="325" text-anchor="middle"><tspan x="237" dy="0">PATCH &lt;upload&gt;  Upload-Offset: n</tspan></text></g><g class="dg-step" data-step="7"><line class="dg-msg dg-dash" x1="390" y1="370" x2="83" y2="370" marker-end="url(#dg-arrow)"/><text class="dg-label mono" x="237" y="360" text-anchor="middle"><tspan x="237" dy="0">204  Upload-Offset: n + chunk</tspan></text></g><g class="dg-step" data-step="8"><line class="dg-msg" x1="83" y1="405" x2="390" y2="405" marker-end="url(#dg-arrow)"/><text class="dg-label mono" x="237" y="395" text-anchor="middle"><tspan x="237" dy="0">HEAD &lt;upload&gt;  (after a cut)</tspan></text></g><g class="dg-step" data-step="9"><line class="dg-msg dg-dash" x1="390" y1="440" x2="83" y2="440" marker-end="url(#dg-arrow)"/><text class="dg-label mono" x="237" y="430" text-anchor="middle"><tspan x="237" dy="0">204  Upload-Offset, Upload-Length</tspan></text></g><g class="dg-step" data-step="10"><line class="dg-msg dg-dash" x1="390" y1="490" x2="83" y2="490" marker-end="url(#dg-arrow)"/><text class="dg-label mono" x="237" y="465" text-anchor="middle"><tspan x="237" dy="0">last chunk: 201 save entry</tspan><tspan x="237" dy="15">or 422 digest_mismatch</tspan></text></g><g class="dg-step" data-step="11"><line class="dg-sep" x1="12" y1="520" x2="461" y2="520"/><rect class="dg-sepbg" x="198" y="508" width="76" height="24" rx="12"/><text class="dg-septext " x="237" y="524" text-anchor="middle"><tspan x="237" dy="0">Restore</tspan></text></g><g class="dg-step" data-step="12"><line class="dg-msg" x1="83" y1="561" x2="390" y2="561" marker-end="url(#dg-arrow)"/><text class="dg-label mono" x="237" y="551" text-anchor="middle"><tspan x="237" dy="0">GET /v1/saves?platform=&amp;title_id=</tspan></text></g><g class="dg-step" data-step="13"><line class="dg-msg dg-dash" x1="390" y1="596" x2="83" y2="596" marker-end="url(#dg-arrow)"/><text class="dg-label mono" x="237" y="586" text-anchor="middle"><tspan x="237" dy="0">{saves: [Save…]}  newest first</tspan></text></g><g class="dg-step" data-step="14"><rect class="dg-note" x="4" y="610" width="380" height="42" rx="8"/><text class="dg-notetext " x="194" y="628" text-anchor="middle"><tspan x="194" dy="0">Compares game_version_code with the installed game:</tspan><tspan x="194" dy="15">warns before restoring on an older one</tspan></text></g><g class="dg-step" data-step="15"><line class="dg-msg" x1="83" y1="683" x2="390" y2="683" marker-end="url(#dg-arrow)"/><text class="dg-label mono" x="237" y="673" text-anchor="middle"><tspan x="237" dy="0">GET /v1/saves/{title_id}/{save_id}</tspan></text></g><g class="dg-step" data-step="16"><line class="dg-msg dg-dash" x1="390" y1="718" x2="83" y2="718" marker-end="url(#dg-arrow)"/><text class="dg-label " x="237" y="708" text-anchor="middle"><tspan x="237" dy="0">The archive (a zip, or encrypted bytes)</tspan></text></g><g class="dg-step" data-step="17"><rect class="dg-note" x="4" y="732" width="442" height="42" rx="8"/><text class="dg-notetext " x="225" y="750" text-anchor="middle"><tspan x="225" dy="0">Checks size and sha256, decrypts if encrypted (§ 9.4),</tspan><tspan x="225" dy="15">then writes it back as the platform&#x27;s profile says (Annex A)</tspan></text></g></svg>
