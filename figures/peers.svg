<?xml version="1.0" encoding="UTF-8"?>
<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 883 393" width="883" height="393" role="img" aria-label="Reading a file from a peer, with a grant from the server"><title>Reading a file from a peer, with a grant from the server</title><style>svg{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12.5px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}.dg-bg{fill:#0e1a33}text{fill:#e8eef7}.dg-head{fill:#a9b6cc}.dg-life{stroke:#22324f;stroke-width:1.5;stroke-dasharray:3 5}.dg-actor{fill:#0b1424;stroke:#00ffcc;stroke-width:1.5}.dg-actortext{font-weight:600}.dg-msg{stroke:#a9b6cc;stroke-width:1.5;fill:none}.dg-dash{stroke-dasharray:5 4}.dg-badline{stroke:#ff6b81}.dg-halo{paint-order:stroke;stroke:#0e1a33;stroke-width:4px;stroke-linejoin:round}.dg-note{fill:#0b1424;stroke:#6f7e9c;stroke-width:1}text.dg-notetext{fill:#a9b6cc}.dg-sep{stroke:#22324f;stroke-width:1;stroke-dasharray:2 4}.dg-sepbg{fill:#0b1424;stroke:#33bbff;stroke-width:1}text.dg-septext{fill:#33bbff;font-weight:600}.dg-node{fill:#0b1424;stroke:#22324f;stroke-width:1.5}.dg-dev{stroke:#00ffcc}.dg-srv{stroke:#33bbff}.dg-key{stroke:#8a5cff}.dg-bad{stroke:#ff6b81}.dg-zone{fill:none;stroke:#22324f;stroke-width:1.5}text.dg-zonetext{fill:#00ffcc;font-weight:600}text.dg-ref{fill:#6f7e9c;font-size:11px}</style><defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-head" d="M0 0L10 5L0 10z"/></marker></defs><rect class="dg-bg" width="883" height="393" rx="12"/><line class="dg-life" x1="80" y1="38" x2="80" y2="387"/><line class="dg-life" x1="441" y1="38" x2="441" y2="387"/><line class="dg-life" x1="803" y1="38" x2="803" y2="387"/><rect class="dg-actor" x="45" y="6" width="69" height="30" rx="8"/><text class="dg-actortext" x="80" y="26" text-anchor="middle"><tspan x="80" dy="0">Client</tspan></text><rect class="dg-actor" x="407" y="6" width="69" height="30" rx="8"/><text class="dg-actortext" x="441" y="26" text-anchor="middle"><tspan x="441" dy="0">Server</tspan></text><rect class="dg-actor" x="747" y="6" width="111" height="30" rx="8"/><text class="dg-actortext" x="803" y="26" text-anchor="middle"><tspan x="803" dy="0">Peer console</tspan></text><line class="dg-msg" x1="83" y1="77" x2="800" y2="77" marker-end="url(#dg-arrow)"/><text class="dg-label mono" x="441" y="67" text-anchor="middle"><tspan x="441" dy="0">UDP 47115  {&quot;peers&quot;: true}</tspan></text><line class="dg-msg dg-dash" x1="800" y1="112" x2="83" y2="112" marker-end="url(#dg-arrow)"/><text class="dg-label mono" x="441" y="102" text-anchor="middle"><tspan x="441" dy="0">{&quot;lantern&quot;:&quot;peer&quot;, port, servers: [uid…]}</tspan></text><line class="dg-msg" x1="83" y1="147" x2="438" y2="147" marker-end="url(#dg-arrow)"/><text class="dg-label mono" x="261" y="137" text-anchor="middle"><tspan x="261" dy="0">GET /v1/grants/sha256/{hex}</tspan></text><line class="dg-msg dg-dash" x1="438" y1="182" x2="83" y2="182" marker-end="url(#dg-arrow)"/><text class="dg-label " x="261" y="172" text-anchor="middle"><tspan x="261" dy="0">{grant, expires}  (signed by the server&#x27;s key)</tspan></text><line class="dg-msg" x1="83" y1="232" x2="800" y2="232" marker-end="url(#dg-arrow)"/><text class="dg-label mono" x="441" y="207" text-anchor="middle"><tspan x="441" dy="0">GET /v1/blobs/sha256/{hex}</tspan><tspan x="441" dy="15">Lantern-Grant: &lt;grant&gt;</tspan></text><rect class="dg-note" x="637" y="246" width="242" height="42" rx="8"/><text class="dg-notetext " x="758" y="264" text-anchor="middle"><tspan x="758" dy="0">Checks the grant with peers.key</tspan><tspan x="758" dy="15">without asking the server</tspan></text><line class="dg-msg dg-dash" x1="800" y1="319" x2="83" y2="319" marker-end="url(#dg-arrow)"/><text class="dg-label " x="441" y="309" text-anchor="middle"><tspan x="441" dy="0">The file (Range, Repr-Digest)</tspan></text><rect class="dg-note" x="4" y="333" width="401" height="42" rx="8"/><text class="dg-notetext " x="204" y="351" text-anchor="middle"><tspan x="204" dy="0">Checks size and SHA-256 against the server&#x27;s document;</tspan><tspan x="204" dy="15">on failure, takes the file from the server</tspan></text></svg>
