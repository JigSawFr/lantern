<?xml version="1.0" encoding="UTF-8"?>
<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 934 326" width="934" height="326" role="img" aria-label="An encrypted backup: the key stays on the user&#x27;s devices"><title>An encrypted backup: the key stays on the user&#x27;s devices</title><style>svg{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12.5px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}.dg-bg{fill:#0e1a33}text{fill:#e8eef7}.dg-head{fill:#a9b6cc}.dg-life{stroke:#22324f;stroke-width:1.5;stroke-dasharray:3 5}.dg-actor{fill:#0b1424;stroke:#00ffcc;stroke-width:1.5}.dg-actortext{font-weight:600}.dg-msg{stroke:#a9b6cc;stroke-width:1.5;fill:none}.dg-dash{stroke-dasharray:5 4}.dg-badline{stroke:#ff6b81}.dg-halo{paint-order:stroke;stroke:#0e1a33;stroke-width:4px;stroke-linejoin:round}.dg-note{fill:#0b1424;stroke:#6f7e9c;stroke-width:1}text.dg-notetext{fill:#a9b6cc}.dg-sep{stroke:#22324f;stroke-width:1;stroke-dasharray:2 4}.dg-sepbg{fill:#0b1424;stroke:#33bbff;stroke-width:1}text.dg-septext{fill:#33bbff;font-weight:600}.dg-node{fill:#0b1424;stroke:#22324f;stroke-width:1.5}.dg-dev{stroke:#00ffcc}.dg-srv{stroke:#33bbff}.dg-key{stroke:#8a5cff}.dg-bad{stroke:#ff6b81}.dg-zone{fill:none;stroke:#22324f;stroke-width:1.5}text.dg-zonetext{fill:#00ffcc;font-weight:600}text.dg-ref{fill:#6f7e9c;font-size:11px}</style><defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-head" d="M0 0L10 5L0 10z"/></marker></defs><rect class="dg-bg" width="934" height="326" rx="12"/><rect class="dg-node dg-dev" x="12" y="12" width="203" height="52" rx="10"/><text class="dg-nodetext " x="114" y="32" text-anchor="middle"><tspan x="114" dy="0">Archive</tspan><tspan x="114" dy="15">(zip)</tspan></text><rect class="dg-node dg-dev" x="365" y="12" width="203" height="52" rx="10"/><text class="dg-nodetext " x="467" y="32" text-anchor="middle"><tspan x="467" dy="0">Encrypts on the device</tspan><tspan x="467" dy="15">XChaCha20-Poly1305</tspan></text><rect class="dg-node dg-srv" x="719" y="12" width="203" height="52" rx="10"/><text class="dg-nodetext " x="820" y="32" text-anchor="middle"><tspan x="820" dy="0">Server</tspan><tspan x="820" dy="15">keeps bytes it cannot read</tspan></text><rect class="dg-node dg-dev" x="12" y="124" width="203" height="52" rx="10"/><text class="dg-nodetext " x="114" y="144" text-anchor="middle"><tspan x="114" dy="0">Other devices</tspan><tspan x="114" dy="15">of the user</tspan></text><rect class="dg-node dg-key" x="365" y="124" width="203" height="52" rx="10"/><text class="dg-nodetext " x="467" y="144" text-anchor="middle"><tspan x="467" dy="0">Save key</tspan><tspan x="467" dy="15">(32 bytes, never leaves)</tspan></text><rect class="dg-node dg-srv" x="719" y="236" width="203" height="52" rx="10"/><text class="dg-nodetext " x="820" y="256" text-anchor="middle"><tspan x="820" dy="0">Server</tspan><tspan x="820" dy="15">same bytes</tspan></text><rect class="dg-node dg-dev" x="365" y="236" width="203" height="52" rx="10"/><text class="dg-nodetext " x="467" y="256" text-anchor="middle"><tspan x="467" dy="0">Decrypts on the device</tspan><tspan x="467" dy="15">every chunk checked</tspan></text><rect class="dg-node dg-dev" x="12" y="244" width="203" height="37" rx="10"/><text class="dg-nodetext " x="114" y="264" text-anchor="middle"><tspan x="114" dy="0">Archive restored</tspan></text><path class="dg-msg" d="M215 38H365" fill="none" marker-end="url(#dg-arrow)"/><text class="dg-label dg-halo mono" x="290" y="30" text-anchor="middle"><tspan x="290" dy="0">zip</tspan></text><path class="dg-msg" d="M569 38H719" fill="none" marker-end="url(#dg-arrow)"/><text class="dg-label dg-halo mono" x="644" y="30" text-anchor="middle"><tspan x="644" dy="0">LTNE2E01 + chunks</tspan></text><path class="dg-msg" d="M467 124V64" fill="none" marker-end="url(#dg-arrow)"/><text class="dg-label dg-halo " x="475" y="98" text-anchor="start"><tspan x="475" dy="0">wraps the file key</tspan></text><path class="dg-msg dg-dash dg-badline" d="M569 150H644V38H719" fill="none" marker-end="url(#dg-arrow)"/><text class="dg-label dg-halo " x="652" y="98" text-anchor="start"><tspan x="652" dy="0">never sent</tspan></text><path class="dg-msg" d="M365 150H215" fill="none" marker-end="url(#dg-arrow)"/><text class="dg-label dg-halo " x="290" y="127" text-anchor="middle"><tspan x="290" dy="0">recovery phrase</tspan><tspan x="290" dy="15">or QR code</tspan></text><path class="dg-msg" d="M719 262H569" fill="none" marker-end="url(#dg-arrow)"/><text class="dg-label dg-halo mono" x="644" y="254" text-anchor="middle"><tspan x="644" dy="0">GET …/{save_id}</tspan></text><path class="dg-msg" d="M467 176V236" fill="none" marker-end="url(#dg-arrow)"/><text class="dg-label dg-halo " x="475" y="210" text-anchor="start"><tspan x="475" dy="0">unwraps the file key</tspan></text><path class="dg-msg" d="M365 262H215" fill="none" marker-end="url(#dg-arrow)"/><text class="dg-label dg-halo mono" x="290" y="254" text-anchor="middle"><tspan x="290" dy="0">zip</tspan></text></svg>
