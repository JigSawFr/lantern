<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 306" width="910" height="306" role="img" aria-label="An invitation: a device pairs without anyone signing in"><title>An invitation: a device pairs without anyone signing in</title><style>svg{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12.5px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}.dg-bg{fill:#0e1a33}text{fill:#e8eef7}.dg-head{fill:#a9b6cc}.dg-life{stroke:#22324f;stroke-width:1.5;stroke-dasharray:3 5}.dg-actor{fill:#0b1424;stroke:#00ffcc;stroke-width:1.5}.dg-actortext{font-weight:600}.dg-msg{stroke:#a9b6cc;stroke-width:1.5;fill:none}.dg-dash{stroke-dasharray:5 4}.dg-badline{stroke:#ff6b81}.dg-halo{paint-order:stroke;stroke:#0e1a33;stroke-width:4px;stroke-linejoin:round}.dg-note{fill:#0b1424;stroke:#6f7e9c;stroke-width:1}text.dg-notetext{fill:#a9b6cc}.dg-sep{stroke:#22324f;stroke-width:1;stroke-dasharray:2 4}.dg-sepbg{fill:#0b1424;stroke:#33bbff;stroke-width:1}text.dg-septext{fill:#33bbff;font-weight:600}.dg-node{fill:#0b1424;stroke:#22324f;stroke-width:1.5}.dg-dev{stroke:#00ffcc}.dg-srv{stroke:#33bbff}.dg-key{stroke:#8a5cff}.dg-bad{stroke:#ff6b81}.dg-zone{fill:none;stroke:#22324f;stroke-width:1.5}text.dg-zonetext{fill:#00ffcc;font-weight:600}text.dg-ref{fill:#6f7e9c;font-size:11px}</style><defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-head" d="M0 0L10 5L0 10z"/></marker></defs><rect class="dg-bg" width="910" height="306" rx="12"/><line class="dg-life" x1="80" y1="38" x2="80" y2="300"/><line class="dg-life" x1="455" y1="38" x2="455" y2="300"/><line class="dg-life" x1="830" y1="38" x2="830" y2="300"/><rect class="dg-actor" x="49" y="6" width="62" height="30" rx="8"/><text class="dg-actortext" x="80" y="26" text-anchor="middle"><tspan x="80" dy="0">Admin</tspan></text><rect class="dg-actor" x="421" y="6" width="69" height="30" rx="8"/><text class="dg-actortext" x="455" y="26" text-anchor="middle"><tspan x="455" dy="0">Server</tspan></text><rect class="dg-actor" x="796" y="6" width="69" height="30" rx="8"/><text class="dg-actortext" x="830" y="26" text-anchor="middle"><tspan x="830" dy="0">Device</tspan></text><g class="dg-step" data-step="0"><line class="dg-msg" x1="83" y1="77" x2="452" y2="77" marker-end="url(#dg-arrow)"/><text class="dg-label " x="268" y="67" text-anchor="middle"><tspan x="268" dy="0">Makes an invitation (§ 5.7)</tspan></text></g><g class="dg-step" data-step="1"><line class="dg-msg dg-dash" x1="452" y1="112" x2="83" y2="112" marker-end="url(#dg-arrow)"/><text class="dg-label mono" x="268" y="102" text-anchor="middle"><tspan x="268" dy="0">{code, link, devices, expires}</tspan></text></g><g class="dg-step" data-step="2"><line class="dg-msg" x1="83" y1="147" x2="827" y2="147" marker-end="url(#dg-arrow)"/><text class="dg-label " x="455" y="137" text-anchor="middle"><tspan x="455" dy="0">Hands over the link or the code</tspan></text></g><g class="dg-step" data-step="3"><line class="dg-msg" x1="827" y1="197" x2="458" y2="197" marker-end="url(#dg-arrow)"/><text class="dg-label mono" x="643" y="172" text-anchor="middle"><tspan x="643" dy="0">POST /v1/pairing</tspan><tspan x="643" dy="15">{device, scopes, key, &quot;invitation&quot;: code}</tspan></text></g><g class="dg-step" data-step="4"><rect class="dg-note" x="272" y="211" width="366" height="42" rx="8"/><text class="dg-notetext " x="455" y="229" text-anchor="middle"><tspan x="455" dy="0">410 gone if unknown, expired, revoked or used up;</tspan><tspan x="455" dy="15">counts each device, stops at devices</tspan></text></g><g class="dg-step" data-step="5"><line class="dg-msg dg-dash" x1="458" y1="284" x2="827" y2="284" marker-end="url(#dg-arrow)"/><text class="dg-label " x="643" y="274" text-anchor="middle"><tspan x="643" dy="0">Approved at once; the first poll gives the token</tspan></text></g></svg>
