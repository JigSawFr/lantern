<?xml version="1.0" encoding="UTF-8"?>
<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 342" width="736" height="342" role="img" aria-label="An author&#x27;s signature, and the key a client pins"><title>An author&#x27;s signature, and the key a client pins</title><style>svg{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12.5px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}.dg-bg{fill:#0e1a33}text{fill:#e8eef7}.dg-head{fill:#a9b6cc}.dg-life{stroke:#22324f;stroke-width:1.5;stroke-dasharray:3 5}.dg-actor{fill:#0b1424;stroke:#00ffcc;stroke-width:1.5}.dg-actortext{font-weight:600}.dg-msg{stroke:#a9b6cc;stroke-width:1.5;fill:none}.dg-dash{stroke-dasharray:5 4}.dg-badline{stroke:#ff6b81}.dg-halo{paint-order:stroke;stroke:#0e1a33;stroke-width:4px;stroke-linejoin:round}.dg-note{fill:#0b1424;stroke:#6f7e9c;stroke-width:1}text.dg-notetext{fill:#a9b6cc}.dg-sep{stroke:#22324f;stroke-width:1;stroke-dasharray:2 4}.dg-sepbg{fill:#0b1424;stroke:#33bbff;stroke-width:1}text.dg-septext{fill:#33bbff;font-weight:600}.dg-node{fill:#0b1424;stroke:#22324f;stroke-width:1.5}.dg-dev{stroke:#00ffcc}.dg-srv{stroke:#33bbff}.dg-key{stroke:#8a5cff}.dg-bad{stroke:#ff6b81}.dg-zone{fill:none;stroke:#22324f;stroke-width:1.5}text.dg-zonetext{fill:#00ffcc;font-weight:600}text.dg-ref{fill:#6f7e9c;font-size:11px}</style><defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-head" d="M0 0L10 5L0 10z"/></marker></defs><rect class="dg-bg" width="736" height="342" rx="12"/><line class="dg-life" x1="80" y1="38" x2="80" y2="336"/><line class="dg-life" x1="368" y1="38" x2="368" y2="336"/><line class="dg-life" x1="656" y1="38" x2="656" y2="336"/><rect class="dg-actor" x="45" y="6" width="69" height="30" rx="8"/><text class="dg-actortext" x="80" y="26" text-anchor="middle"><tspan x="80" dy="0">Author</tspan></text><rect class="dg-actor" x="334" y="6" width="69" height="30" rx="8"/><text class="dg-actortext" x="368" y="26" text-anchor="middle"><tspan x="368" dy="0">Server</tspan></text><rect class="dg-actor" x="622" y="6" width="69" height="30" rx="8"/><text class="dg-actortext" x="656" y="26" text-anchor="middle"><tspan x="656" dy="0">Client</tspan></text><line class="dg-msg" x1="83" y1="92" x2="365" y2="92" marker-end="url(#dg-arrow)"/><text class="dg-label mono" x="224" y="67" text-anchor="middle"><tspan x="224" dy="0">package + signature</tspan><tspan x="224" dy="15">{alg: ed25519, public_key, value}</tspan></text><rect class="dg-note" x="251" y="106" width="235" height="42" rx="8"/><text class="dg-notetext " x="368" y="124" text-anchor="middle"><tspan x="368" dy="0">Serves the signature as given;</tspan><tspan x="368" dy="15">never signs for an author</tspan></text><line class="dg-msg dg-dash" x1="371" y1="179" x2="653" y2="179" marker-end="url(#dg-arrow)"/><text class="dg-label mono" x="512" y="169" text-anchor="middle"><tspan x="512" dy="0">entry + package + signature</tspan></text><rect class="dg-note" x="422" y="193" width="311" height="42" rx="8"/><text class="dg-notetext " x="577" y="211" text-anchor="middle"><tspan x="577" dy="0">Checks the signature of what it installs;</tspan><tspan x="577" dy="15">refuses the package if it does not verify</tspan></text><rect class="dg-note" x="408" y="245" width="325" height="27" rx="8"/><text class="dg-notetext " x="570" y="263" text-anchor="middle"><tspan x="570" dy="0">First install of an id: pins the public key</tspan></text><rect class="dg-note" x="339" y="282" width="394" height="42" rx="8"/><text class="dg-notetext " x="536" y="300" text-anchor="middle"><tspan x="536" dy="0">Another key, or unsigned after signed: refused unless</tspan><tspan x="536" dy="15">the user accepts after both fingerprints are shown</tspan></text></svg>
