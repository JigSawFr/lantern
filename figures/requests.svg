<?xml version="1.0" encoding="UTF-8"?>
<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 933 214" width="933" height="214" role="img" aria-label="The life of a request"><title>The life of a request</title><style>svg{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12.5px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}.dg-bg{fill:#0e1a33}text{fill:#e8eef7}.dg-head{fill:#a9b6cc}.dg-life{stroke:#22324f;stroke-width:1.5;stroke-dasharray:3 5}.dg-actor{fill:#0b1424;stroke:#00ffcc;stroke-width:1.5}.dg-actortext{font-weight:600}.dg-msg{stroke:#a9b6cc;stroke-width:1.5;fill:none}.dg-dash{stroke-dasharray:5 4}.dg-badline{stroke:#ff6b81}.dg-halo{paint-order:stroke;stroke:#0e1a33;stroke-width:4px;stroke-linejoin:round}.dg-note{fill:#0b1424;stroke:#6f7e9c;stroke-width:1}text.dg-notetext{fill:#a9b6cc}.dg-sep{stroke:#22324f;stroke-width:1;stroke-dasharray:2 4}.dg-sepbg{fill:#0b1424;stroke:#33bbff;stroke-width:1}text.dg-septext{fill:#33bbff;font-weight:600}.dg-node{fill:#0b1424;stroke:#22324f;stroke-width:1.5}.dg-dev{stroke:#00ffcc}.dg-srv{stroke:#33bbff}.dg-key{stroke:#8a5cff}.dg-bad{stroke:#ff6b81}.dg-zone{fill:none;stroke:#22324f;stroke-width:1.5}text.dg-zonetext{fill:#00ffcc;font-weight:600}text.dg-ref{fill:#6f7e9c;font-size:11px}</style><defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-head" d="M0 0L10 5L0 10z"/></marker></defs><rect class="dg-bg" width="933" height="214" rx="12"/><rect class="dg-node dg-dev" x="12" y="12" width="190" height="52" rx="10"/><text class="dg-nodetext " x="107" y="32" text-anchor="middle"><tspan x="107" dy="0">An account asks</tspan><tspan x="107" dy="15">for a title</tspan></text><rect class="dg-node dg-srv" x="372" y="20" width="190" height="37" rx="10"/><text class="dg-nodetext mono" x="466" y="40" text-anchor="middle"><tspan x="466" dy="0">open</tspan></text><rect class="dg-node dg-dev" x="731" y="20" width="190" height="37" rx="10"/><text class="dg-nodetext mono" x="826" y="40" text-anchor="middle"><tspan x="826" dy="0">done</tspan></text><rect class="dg-node dg-bad" x="731" y="132" width="190" height="37" rx="10"/><text class="dg-nodetext mono" x="826" y="152" text-anchor="middle"><tspan x="826" dy="0">declined</tspan></text><rect class="dg-node dg-dev" x="372" y="124" width="190" height="52" rx="10"/><text class="dg-nodetext " x="466" y="144" text-anchor="middle"><tspan x="466" dy="0">Withdrawn</tspan><tspan x="466" dy="15">(the account deletes it)</tspan></text><path class="dg-msg" d="M202 38H372" fill="none" marker-end="url(#dg-arrow)"/><text class="dg-label dg-halo mono" x="287" y="30" text-anchor="middle"><tspan x="287" dy="0">POST /v1/requests</tspan></text><path class="dg-msg" d="M561 38H731" fill="none" marker-end="url(#dg-arrow)"/><text class="dg-label dg-halo " x="646" y="15" text-anchor="middle"><tspan x="646" dy="0">the title arrives,</tspan><tspan x="646" dy="15">or an admin says so</tspan></text><path class="dg-msg" d="M561 38H646V150H731" fill="none" marker-end="url(#dg-arrow)"/><text class="dg-label dg-halo " x="654" y="98" text-anchor="start"><tspan x="654" dy="0">an admin declines,</tspan><tspan x="654" dy="15">with a reason or without</tspan></text><path class="dg-msg" d="M466 56V124" fill="none" marker-end="url(#dg-arrow)"/><text class="dg-label dg-halo mono" x="474" y="94" text-anchor="start"><tspan x="474" dy="0">DELETE</tspan></text></svg>
