<?xml version="1.0" encoding="UTF-8"?>
<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 485 579" width="485" height="579" role="img" aria-label="A stream of events, and how it resumes"><title>A stream of events, and how it resumes</title><style>svg{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12.5px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}.dg-bg{fill:#0e1a33}text{fill:#e8eef7}.dg-head{fill:#a9b6cc}.dg-life{stroke:#22324f;stroke-width:1.5;stroke-dasharray:3 5}.dg-actor{fill:#0b1424;stroke:#00ffcc;stroke-width:1.5}.dg-actortext{font-weight:600}.dg-msg{stroke:#a9b6cc;stroke-width:1.5;fill:none}.dg-dash{stroke-dasharray:5 4}.dg-badline{stroke:#ff6b81}.dg-halo{paint-order:stroke;stroke:#0e1a33;stroke-width:4px;stroke-linejoin:round}.dg-note{fill:#0b1424;stroke:#6f7e9c;stroke-width:1}text.dg-notetext{fill:#a9b6cc}.dg-sep{stroke:#22324f;stroke-width:1;stroke-dasharray:2 4}.dg-sepbg{fill:#0b1424;stroke:#33bbff;stroke-width:1}text.dg-septext{fill:#33bbff;font-weight:600}.dg-node{fill:#0b1424;stroke:#22324f;stroke-width:1.5}.dg-dev{stroke:#00ffcc}.dg-srv{stroke:#33bbff}.dg-key{stroke:#8a5cff}.dg-bad{stroke:#ff6b81}.dg-zone{fill:none;stroke:#22324f;stroke-width:1.5}text.dg-zonetext{fill:#00ffcc;font-weight:600}text.dg-ref{fill:#6f7e9c;font-size:11px}</style><defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-head" d="M0 0L10 5L0 10z"/></marker></defs><rect class="dg-bg" width="485" height="579" rx="12"/><line class="dg-life" x1="80" y1="38" x2="80" y2="573"/><line class="dg-life" x1="405" y1="38" x2="405" y2="573"/><rect class="dg-actor" x="45" y="6" width="69" height="30" rx="8"/><text class="dg-actortext" x="80" y="26" text-anchor="middle"><tspan x="80" dy="0">Client</tspan></text><rect class="dg-actor" x="370" y="6" width="69" height="30" rx="8"/><text class="dg-actortext" x="405" y="26" text-anchor="middle"><tspan x="405" dy="0">Server</tspan></text><g class="dg-step" data-step="0"><line class="dg-msg" x1="83" y1="92" x2="402" y2="92" marker-end="url(#dg-arrow)"/><text class="dg-label mono" x="243" y="67" text-anchor="middle"><tspan x="243" dy="0">GET /v1/events</tspan><tspan x="243" dy="15">Accept: text/event-stream</tspan></text></g><g class="dg-step" data-step="1"><line class="dg-msg dg-dash" x1="402" y1="142" x2="83" y2="142" marker-end="url(#dg-arrow)"/><text class="dg-label mono" x="243" y="117" text-anchor="middle"><tspan x="243" dy="0">200  retry: 5000</tspan><tspan x="243" dy="15">event: ready  id: s_…</tspan></text></g><g class="dg-step" data-step="2"><line class="dg-msg dg-dash" x1="402" y1="192" x2="83" y2="192" marker-end="url(#dg-arrow)"/><text class="dg-label mono" x="243" y="167" text-anchor="middle"><tspan x="243" dy="0">event: library | request | save | sync</tspan><tspan x="243" dy="15">id: s_…</tspan></text></g><g class="dg-step" data-step="3"><line class="dg-msg dg-dash" x1="402" y1="227" x2="83" y2="227" marker-end="url(#dg-arrow)"/><text class="dg-label mono" x="243" y="217" text-anchor="middle"><tspan x="243" dy="0">: heartbeat  (every limits.heartbeat)</tspan></text></g><g class="dg-step" data-step="4"><rect class="dg-note" x="52" y="241" width="381" height="27" rx="8"/><text class="dg-notetext " x="243" y="259" text-anchor="middle"><tspan x="243" dy="0">The connection drops, or the server ends it</tspan></text></g><g class="dg-step" data-step="5"><line class="dg-msg" x1="83" y1="314" x2="402" y2="314" marker-end="url(#dg-arrow)"/><text class="dg-label mono" x="243" y="289" text-anchor="middle"><tspan x="243" dy="0">GET /v1/events</tspan><tspan x="243" dy="15">Last-Event-ID: &lt;last id&gt;</tspan></text></g><g class="dg-step" data-step="6"><line class="dg-msg dg-dash" x1="402" y1="349" x2="83" y2="349" marker-end="url(#dg-arrow)"/><text class="dg-label " x="243" y="339" text-anchor="middle"><tspan x="243" dy="0">Every missed event, then the new ones</tspan></text></g><g class="dg-step" data-step="7"><line class="dg-msg dg-dash" x1="402" y1="384" x2="83" y2="384" marker-end="url(#dg-arrow)"/><text class="dg-label " x="243" y="374" text-anchor="middle"><tspan x="243" dy="0">or 410 gone (token too old)</tspan></text></g><g class="dg-step" data-step="8"><rect class="dg-note" x="4" y="398" width="228" height="42" rx="8"/><text class="dg-notetext " x="118" y="416" text-anchor="middle"><tspan x="118" dy="0">Reads again what it shows,</tspan><tspan x="118" dy="15">then connects without a token</tspan></text></g><g class="dg-step" data-step="9"><line class="dg-sep" x1="12" y1="466" x2="473" y2="466"/><rect class="dg-sepbg" x="42" y="454" width="401" height="24" rx="12"/><text class="dg-septext " x="243" y="470" text-anchor="middle"><tspan x="243" dy="0">Where a stream cannot stay open: long polling (§ 18.3)</tspan></text></g><g class="dg-step" data-step="10"><line class="dg-msg" x1="83" y1="507" x2="402" y2="507" marker-end="url(#dg-arrow)"/><text class="dg-label mono" x="243" y="497" text-anchor="middle"><tspan x="243" dy="0">GET /v1/changes?since=&lt;token&gt;&amp;wait=30</tspan></text></g><g class="dg-step" data-step="11"><line class="dg-msg dg-dash" x1="402" y1="557" x2="83" y2="557" marker-end="url(#dg-arrow)"/><text class="dg-label " x="243" y="532" text-anchor="middle"><tspan x="243" dy="0">events, since: as soon as one comes,</tspan><tspan x="243" dy="15">or after wait seconds</tspan></text></g></svg>
