<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 762 424" width="762" height="424" role="group" aria-label="What Lantern defends against"><title>What Lantern defends against</title><style>svg{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12.5px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}.dg-bg{fill:#0e1a33}text{fill:#e8eef7}.dg-head{fill:#a9b6cc}.dg-life{stroke:#22324f;stroke-width:1.5;stroke-dasharray:3 5}.dg-actor{fill:#0b1424;stroke:#00ffcc;stroke-width:1.5}.dg-actortext{font-weight:600}.dg-msg{stroke:#a9b6cc;stroke-width:1.5;fill:none}.dg-dash{stroke-dasharray:5 4}.dg-badline{stroke:#ff6b81}.dg-halo{paint-order:stroke;stroke:#0e1a33;stroke-width:4px;stroke-linejoin:round}.dg-note{fill:#0b1424;stroke:#6f7e9c;stroke-width:1}text.dg-notetext{fill:#a9b6cc}.dg-sep{stroke:#22324f;stroke-width:1;stroke-dasharray:2 4}.dg-sepbg{fill:#0b1424;stroke:#33bbff;stroke-width:1}text.dg-septext{fill:#33bbff;font-weight:600}.dg-node{fill:#0b1424;stroke:#22324f;stroke-width:1.5}.dg-dev{stroke:#00ffcc}.dg-srv{stroke:#33bbff}.dg-key{stroke:#8a5cff}.dg-bad{stroke:#ff6b81}.dg-zone{fill:none;stroke:#22324f;stroke-width:1.5}text.dg-zonetext{fill:#00ffcc;font-weight:600}text.dg-ref{fill:#6f7e9c;font-size:11px}</style><defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-head" d="M0 0L10 5L0 10z"/></marker></defs><rect class="dg-bg" width="762" height="424" rx="12"/><rect class="dg-zone" x="6" y="8" width="238" height="248" rx="12"/><text class="dg-zonetext " x="125" y="30" text-anchor="middle"><tspan x="125" dy="0">Hostile network</tspan></text><rect class="dg-node dg-dev" x="14" y="42" width="222" height="46" rx="8"/><text class="dg-nodetext " x="24" y="62" text-anchor="start"><tspan x="24" dy="0">TLS everywhere</tspan></text><text class="dg-ref" x="24" y="78" text-anchor="start"><tspan x="24" dy="0">§ 2</tspan></text><rect class="dg-node dg-dev" x="14" y="94" width="222" height="46" rx="8"/><text class="dg-nodetext " x="24" y="114" text-anchor="start"><tspan x="24" dy="0">Key pinned at pairing</tspan></text><text class="dg-ref" x="24" y="130" text-anchor="start"><tspan x="24" dy="0">§ 5.3</tspan></text><rect class="dg-node dg-dev" x="14" y="146" width="222" height="46" rx="8"/><text class="dg-nodetext " x="24" y="166" text-anchor="start"><tspan x="24" dy="0">Signed requests</tspan></text><text class="dg-ref" x="24" y="182" text-anchor="start"><tspan x="24" dy="0">§ 5.4</tspan></text><rect class="dg-node dg-dev" x="14" y="198" width="222" height="46" rx="8"/><text class="dg-nodetext " x="24" y="218" text-anchor="start"><tspan x="24" dy="0">Files checked by SHA-256</tspan></text><text class="dg-ref" x="24" y="234" text-anchor="start"><tspan x="24" dy="0">§ 6.6</tspan></text><rect class="dg-zone" x="256" y="8" width="238" height="248" rx="12"/><text class="dg-zonetext " x="375" y="30" text-anchor="middle"><tspan x="375" dy="0">Malicious server</tspan></text><rect class="dg-node dg-dev" x="264" y="42" width="222" height="46" rx="8"/><text class="dg-nodetext " x="274" y="62" text-anchor="start"><tspan x="274" dy="0">Paths kept under the roots</tspan></text><text class="dg-ref" x="274" y="78" text-anchor="start"><tspan x="274" dy="0">§ 8.2</tspan></text><rect class="dg-node dg-dev" x="264" y="94" width="222" height="46" rx="8"/><text class="dg-nodetext " x="274" y="114" text-anchor="start"><tspan x="274" dy="0">Author signature checked</tspan></text><text class="dg-ref" x="274" y="130" text-anchor="start"><tspan x="274" dy="0">§ 8.4</tspan></text><rect class="dg-node dg-dev" x="264" y="146" width="222" height="46" rx="8"/><text class="dg-nodetext " x="274" y="166" text-anchor="start"><tspan x="274" dy="0">Every document bounded</tspan></text><text class="dg-ref" x="274" y="182" text-anchor="start"><tspan x="274" dy="0">§ 13</tspan></text><rect class="dg-zone" x="506" y="8" width="238" height="248" rx="12"/><text class="dg-zonetext " x="625" y="30" text-anchor="middle"><tspan x="625" dy="0">Stolen token</tspan></text><rect class="dg-node dg-dev" x="514" y="42" width="222" height="46" rx="8"/><text class="dg-nodetext " x="524" y="62" text-anchor="start"><tspan x="524" dy="0">Token bound to a device key</tspan></text><text class="dg-ref" x="524" y="78" text-anchor="start"><tspan x="524" dy="0">§ 5.4</tspan></text><rect class="dg-zone" x="6" y="268" width="238" height="144" rx="12"/><text class="dg-zonetext " x="125" y="290" text-anchor="middle"><tspan x="125" dy="0">Hostile mirror or peer</tspan></text><rect class="dg-node dg-dev" x="14" y="302" width="222" height="46" rx="8"/><text class="dg-nodetext " x="24" y="322" text-anchor="start"><tspan x="24" dy="0">Size and SHA-256 checked</tspan></text><text class="dg-ref" x="24" y="338" text-anchor="start"><tspan x="24" dy="0">§ 19.1</tspan></text><rect class="dg-node dg-dev" x="14" y="354" width="222" height="46" rx="8"/><text class="dg-nodetext " x="24" y="374" text-anchor="start"><tspan x="24" dy="0">No credential sent to them</tspan></text><text class="dg-ref" x="24" y="390" text-anchor="start"><tspan x="24" dy="0">§ 19.1</tspan></text><rect class="dg-zone" x="256" y="268" width="238" height="144" rx="12"/><text class="dg-zonetext " x="375" y="290" text-anchor="middle"><tspan x="375" dy="0">Curious server</tspan></text><rect class="dg-node dg-dev" x="264" y="302" width="222" height="46" rx="8"/><text class="dg-nodetext " x="274" y="322" text-anchor="start"><tspan x="274" dy="0">Saves encrypted on the device</tspan></text><text class="dg-ref" x="274" y="338" text-anchor="start"><tspan x="274" dy="0">§ 9.4</tspan></text><rect class="dg-node dg-dev" x="264" y="354" width="222" height="46" rx="8"/><text class="dg-nodetext " x="274" y="374" text-anchor="start"><tspan x="274" dy="0">Sync only with consent</tspan></text><text class="dg-ref" x="274" y="390" text-anchor="start"><tspan x="274" dy="0">§ 20.1</tspan></text></svg>
