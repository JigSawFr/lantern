<?xml version="1.0" encoding="UTF-8"?>
<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1045 329" width="1045" height="329" role="img" aria-label="Updating a file from an older version, chunk by chunk"><title>Updating a file from an older version, chunk by chunk</title><style>svg{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12.5px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}.dg-bg{fill:#0e1a33}text{fill:#e8eef7}.dg-head{fill:#a9b6cc}.dg-life{stroke:#22324f;stroke-width:1.5;stroke-dasharray:3 5}.dg-actor{fill:#0b1424;stroke:#00ffcc;stroke-width:1.5}.dg-actortext{font-weight:600}.dg-msg{stroke:#a9b6cc;stroke-width:1.5;fill:none}.dg-dash{stroke-dasharray:5 4}.dg-badline{stroke:#ff6b81}.dg-halo{paint-order:stroke;stroke:#0e1a33;stroke-width:4px;stroke-linejoin:round}.dg-note{fill:#0b1424;stroke:#6f7e9c;stroke-width:1}text.dg-notetext{fill:#a9b6cc}.dg-sep{stroke:#22324f;stroke-width:1;stroke-dasharray:2 4}.dg-sepbg{fill:#0b1424;stroke:#33bbff;stroke-width:1}text.dg-septext{fill:#33bbff;font-weight:600}.dg-node{fill:#0b1424;stroke:#22324f;stroke-width:1.5}.dg-dev{stroke:#00ffcc}.dg-srv{stroke:#33bbff}.dg-key{stroke:#8a5cff}.dg-bad{stroke:#ff6b81}.dg-zone{fill:none;stroke:#22324f;stroke-width:1.5}text.dg-zonetext{fill:#00ffcc;font-weight:600}text.dg-ref{fill:#6f7e9c;font-size:11px}</style><defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-head" d="M0 0L10 5L0 10z"/></marker></defs><rect class="dg-bg" width="1045" height="329" rx="12"/><rect class="dg-node dg-dev" x="12" y="20" width="210" height="52" rx="10"/><text class="dg-nodetext " x="117" y="40" text-anchor="middle"><tspan x="117" dy="0">Seeds</tspan><tspan x="117" dy="15">bytes of an older version</tspan></text><rect class="dg-node dg-dev" x="372" y="20" width="210" height="52" rx="10"/><text class="dg-nodetext " x="477" y="40" text-anchor="middle"><tspan x="477" dy="0">Cuts each seed with the</tspan><tspan x="477" dy="15">index&#x27;s chunker</tspan></text><rect class="dg-node dg-srv" x="733" y="20" width="210" height="52" rx="10"/><text class="dg-nodetext " x="838" y="40" text-anchor="middle"><tspan x="838" dy="0">Reads the other chunks</tspan><tspan x="838" dy="15">as ranges of the file</tspan></text><rect class="dg-node dg-srv" x="372" y="125" width="210" height="67" rx="10"/><text class="dg-nodetext " x="477" y="145" text-anchor="middle"><tspan x="477" dy="0">Chunk index</tspan><tspan x="477" dy="15">size and sha256 checked</tspan><tspan x="477" dy="15">GET /v1/chunks/sha256/{hex}</tspan></text><rect class="dg-node dg-dev" x="733" y="132" width="210" height="52" rx="10"/><text class="dg-nodetext " x="838" y="152" text-anchor="middle"><tspan x="838" dy="0">Puts the file</tspan><tspan x="838" dy="15">together</tspan></text><rect class="dg-node dg-key" x="733" y="246" width="210" height="52" rx="10"/><text class="dg-nodetext " x="838" y="266" text-anchor="middle"><tspan x="838" dy="0">Checks every chunk,</tspan><tspan x="838" dy="15">then the whole sha256</tspan></text><rect class="dg-node dg-dev" x="372" y="253" width="210" height="37" rx="10"/><text class="dg-nodetext " x="477" y="273" text-anchor="middle"><tspan x="477" dy="0">Installs as any download</tspan></text><path class="dg-msg" d="M222 46H372" fill="none" marker-end="url(#dg-arrow)"/><path class="dg-msg" d="M477 125V72" fill="none" marker-end="url(#dg-arrow)"/><path class="dg-msg" d="M583 46H733" fill="none" marker-end="url(#dg-arrow)"/><text class="dg-label dg-halo " x="658" y="38" text-anchor="middle"><tspan x="658" dy="0">chunks not found</tspan></text><path class="dg-msg" d="M583 46H658V158H733" fill="none" marker-end="url(#dg-arrow)"/><text class="dg-label dg-halo " x="666" y="106" text-anchor="start"><tspan x="666" dy="0">chunks found in a seed</tspan></text><path class="dg-msg" d="M838 72V132" fill="none" marker-end="url(#dg-arrow)"/><text class="dg-label dg-halo " x="846" y="106" text-anchor="start"><tspan x="846" dy="0">each chunk checked</tspan></text><path class="dg-msg" d="M838 184V246" fill="none" marker-end="url(#dg-arrow)"/><path class="dg-msg" d="M733 272H583" fill="none" marker-end="url(#dg-arrow)"/></svg>
