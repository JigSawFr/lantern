<?xml version="1.0" encoding="UTF-8"?>
<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 796 752" width="796" height="752" role="img" aria-label="From finding a server to the first signed call"><title>From finding a server to the first signed call</title><style>svg{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12.5px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}.dg-bg{fill:#0e1a33}text{fill:#e8eef7}.dg-head{fill:#a9b6cc}.dg-life{stroke:#22324f;stroke-width:1.5;stroke-dasharray:3 5}.dg-actor{fill:#0b1424;stroke:#00ffcc;stroke-width:1.5}.dg-actortext{font-weight:600}.dg-msg{stroke:#a9b6cc;stroke-width:1.5;fill:none}.dg-dash{stroke-dasharray:5 4}.dg-badline{stroke:#ff6b81}.dg-halo{paint-order:stroke;stroke:#0e1a33;stroke-width:4px;stroke-linejoin:round}.dg-note{fill:#0b1424;stroke:#6f7e9c;stroke-width:1}text.dg-notetext{fill:#a9b6cc}.dg-sep{stroke:#22324f;stroke-width:1;stroke-dasharray:2 4}.dg-sepbg{fill:#0b1424;stroke:#33bbff;stroke-width:1}text.dg-septext{fill:#33bbff;font-weight:600}.dg-node{fill:#0b1424;stroke:#22324f;stroke-width:1.5}.dg-dev{stroke:#00ffcc}.dg-srv{stroke:#33bbff}.dg-key{stroke:#8a5cff}.dg-bad{stroke:#ff6b81}.dg-zone{fill:none;stroke:#22324f;stroke-width:1.5}text.dg-zonetext{fill:#00ffcc;font-weight:600}text.dg-ref{fill:#6f7e9c;font-size:11px}</style><defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-head" d="M0 0L10 5L0 10z"/></marker></defs><rect class="dg-bg" width="796" height="752" rx="12"/><line class="dg-life" x1="80" y1="38" x2="80" y2="746"/><line class="dg-life" x1="398" y1="38" x2="398" y2="746"/><line class="dg-life" x1="716" y1="38" x2="716" y2="746"/><rect class="dg-actor" x="45" y="6" width="69" height="30" rx="8"/><text class="dg-actortext" x="80" y="26" text-anchor="middle"><tspan x="80" dy="0">Device</tspan></text><rect class="dg-actor" x="363" y="6" width="69" height="30" rx="8"/><text class="dg-actortext" x="398" y="26" text-anchor="middle"><tspan x="398" dy="0">Server</tspan></text><rect class="dg-actor" x="660" y="6" width="111" height="30" rx="8"/><text class="dg-actortext" x="716" y="26" text-anchor="middle"><tspan x="716" dy="0">User&#x27;s phone</tspan></text><g class="dg-step" data-step="0"><line class="dg-msg" x1="83" y1="77" x2="395" y2="77" marker-end="url(#dg-arrow)"/><text class="dg-label mono" x="239" y="67" text-anchor="middle"><tspan x="239" dy="0">UDP 47115  {&quot;lantern&quot;:&quot;discover&quot;}</tspan></text></g><g class="dg-step" data-step="1"><line class="dg-msg dg-dash" x1="395" y1="112" x2="83" y2="112" marker-end="url(#dg-arrow)"/><text class="dg-label mono" x="239" y="102" text-anchor="middle"><tspan x="239" dy="0">{&quot;lantern&quot;:&quot;server&quot;, uid, port, base}</tspan></text></g><g class="dg-step" data-step="2"><rect class="dg-note" x="52" y="126" width="374" height="27" rx="8"/><text class="dg-notetext " x="239" y="144" text-anchor="middle"><tspan x="239" dy="0">A hint only: trust comes from TLS and pairing</tspan></text></g><g class="dg-step" data-step="3"><line class="dg-msg" x1="83" y1="184" x2="395" y2="184" marker-end="url(#dg-arrow)"/><text class="dg-label mono" x="239" y="174" text-anchor="middle"><tspan x="239" dy="0">GET /.well-known/lantern</tspan></text></g><g class="dg-step" data-step="4"><line class="dg-msg dg-dash" x1="395" y1="234" x2="83" y2="234" marker-end="url(#dg-arrow)"/><text class="dg-label mono" x="239" y="209" text-anchor="middle"><tspan x="239" dy="0">handshake: uid, versions,</tspan><tspan x="239" dy="15">platforms, features, limits</tspan></text></g><g class="dg-step" data-step="5"><line class="dg-sep" x1="12" y1="264" x2="784" y2="264"/><rect class="dg-sepbg" x="332" y="252" width="132" height="24" rx="12"/><text class="dg-septext " x="398" y="268" text-anchor="middle"><tspan x="398" dy="0">Pairing (§ 5.2)</tspan></text></g><g class="dg-step" data-step="6"><line class="dg-msg" x1="83" y1="320" x2="395" y2="320" marker-end="url(#dg-arrow)"/><text class="dg-label mono" x="239" y="295" text-anchor="middle"><tspan x="239" dy="0">POST /v1/pairing</tspan><tspan x="239" dy="15">{device, scopes, key}</tspan></text></g><g class="dg-step" data-step="7"><line class="dg-msg dg-dash" x1="395" y1="370" x2="83" y2="370" marker-end="url(#dg-arrow)"/><text class="dg-label mono" x="239" y="345" text-anchor="middle"><tspan x="239" dy="0">code KQ4M-7TXD, verify_complete,</tspan><tspan x="239" dy="15">poll, interval</tspan></text></g><g class="dg-step" data-step="8"><rect class="dg-note" x="4" y="384" width="242" height="42" rx="8"/><text class="dg-notetext " x="125" y="402" text-anchor="middle"><tspan x="125" dy="0">Shows the code, a QR code</tspan><tspan x="125" dy="15">and the key&#x27;s short fingerprint</tspan></text></g><g class="dg-step" data-step="9"><line class="dg-msg" x1="713" y1="472" x2="401" y2="472" marker-end="url(#dg-arrow)"/><text class="dg-label " x="557" y="447" text-anchor="middle"><tspan x="557" dy="0">Opens the link, signs in,</tspan><tspan x="557" dy="15">compares the fingerprint, approves</tspan></text></g><g class="dg-step" data-step="10"><line class="dg-msg" x1="83" y1="507" x2="395" y2="507" marker-end="url(#dg-arrow)"/><text class="dg-label mono" x="239" y="497" text-anchor="middle"><tspan x="239" dy="0">GET &lt;poll&gt;  (every interval)</tspan></text></g><g class="dg-step" data-step="11"><line class="dg-msg dg-dash" x1="395" y1="557" x2="83" y2="557" marker-end="url(#dg-arrow)"/><text class="dg-label mono" x="239" y="532" text-anchor="middle"><tspan x="239" dy="0">202 …  then  200 {token: et_…}</tspan><tspan x="239" dy="15">or 410 gone · 429 slow_down</tspan></text></g><g class="dg-step" data-step="12"><rect class="dg-note" x="4" y="571" width="173" height="42" rx="8"/><text class="dg-notetext " x="90" y="589" text-anchor="middle"><tspan x="90" dy="0">Pins the server&#x27;s key</tspan><tspan x="90" dy="15">for this uid (§ 5.3)</tspan></text></g><g class="dg-step" data-step="13"><line class="dg-sep" x1="12" y1="639" x2="784" y2="639"/><rect class="dg-sepbg" x="318" y="627" width="159" height="24" rx="12"/><text class="dg-septext " x="398" y="643" text-anchor="middle"><tspan x="398" dy="0">Then, on every call</tspan></text></g><g class="dg-step" data-step="14"><line class="dg-msg" x1="83" y1="695" x2="395" y2="695" marker-end="url(#dg-arrow)"/><text class="dg-label mono" x="239" y="670" text-anchor="middle"><tspan x="239" dy="0">Authorization: Bearer et_…</tspan><tspan x="239" dy="15">+ request signature</tspan></text></g><g class="dg-step" data-step="15"><line class="dg-msg dg-dash" x1="395" y1="730" x2="83" y2="730" marker-end="url(#dg-arrow)"/><text class="dg-label mono" x="239" y="720" text-anchor="middle"><tspan x="239" dy="0">200  ·  401  ·  403</tspan></text></g></svg>
