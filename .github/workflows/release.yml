# A release of the specification (SPEC.md § 3.6), on a tag spec-v<version>
# (spec-v0.6) that names the version SPEC.md gives: the checks first, then
# tools/release.py writes SPEC.md, openapi.yaml, the zips of the schemas,
# examples, test vectors and conformance suite, one zip of them all and
# SHA256SUMS, reproducibly (dated by the tagged commit); GitHub attests the
# provenance of each (SLSA, Sigstore), and the release carries them, a
# prerelease while the text is a draft. To check one:
#   gh attestation verify lantern-0.6.zip --repo JigSawFr/lantern
# The maintainer makes the tag; nothing here makes one.
name: release

on:
  push:
    tags: [ "spec-v*" ]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write       # the release and its files
      id-token: write       # the attestations' signing certificate
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The checks a release passes first
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet -r tools/requirements.txt
          "$RUNNER_TEMP/venv/bin/python" tools/requirements.py
          "$RUNNER_TEMP/venv/bin/python" tools/check_schemas.py
          python3 tools/make_vectors.py --check
      - name: The release's files
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          python3 tools/release.py --tag "$GITHUB_REF_NAME" --out dist --notes "$RUNNER_TEMP/notes.md"
      - name: Their build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: The release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#spec-v}
          prerelease=()
          if grep -q "^Draft $version," SPEC.md; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag "${prerelease[@]}" \
            --title "Lantern $version" --notes-file "$RUNNER_TEMP/notes.md"
