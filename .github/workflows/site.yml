# Lantern's website (site/README.md) on GitHub Pages, its source GitHub
# Actions (Settings › Pages): the protocol's page and the specification
# rendered from SPEC.md, in the fifteen languages of Boréale's sites, its
# drafts as they were published (read from git: the whole history is checked
# out), its French translation, the error types, and the demo library, which
# the conformance suite checks with its trapped variant. Published at each
# push to main touching it, and on demand; a pull request only builds and
# checks it.
#
# The checkout, the layout check and the Pages artifact are boreale-site's
# reusable workflow (library/boreale-site's README, "Reusable workflow");
# the deployment is this repository's.
name: site

on:
  push:
    branches: [ main ]
    paths: [ "site/**", "SPEC.md", "tools/build_site.py", "tools/check_site.py", "library/boreale-site", ".gitmodules", "tools/requirements.py", "tools/make_demo.py", "tools/requirements.txt", "conformance/**", "server/**", "schemas/**", ".github/workflows/site.yml" ]
  pull_request:
    paths: [ "site/**", "SPEC.md", "tools/build_site.py", "tools/check_site.py", "library/boreale-site", ".gitmodules", "tools/requirements.py", "tools/make_demo.py", "tools/requirements.txt", "conformance/**", "server/**", "schemas/**", ".github/workflows/site.yml" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pages: read   # asked by the reusable workflow (the site's address)
    uses: JigSawFr/boreale-site/.github/workflows/site.yml@49844b1a733f738afdabcc1c903bbf8696028d96 # v1.0.0
    with:
      # The specification's drafts are SPEC.md at their commits (git show): the whole history.
      fetch_depth: 0
      build: python3 tools/build_site.py build
      check: |
        # Their links, catalogs and Content-Security-Policy.
        python3 tools/check_site.py build
        # The demo library at Lantern Static, and its trapped variant refused, by the conformance suite.
        python3 -m venv "$RUNNER_TEMP/venv"
        "$RUNNER_TEMP/venv/bin/pip" install --quiet -r tools/requirements.txt
        "$RUNNER_TEMP/venv/bin/python" tools/make_demo.py check build/demo
        # As a client reads it on GitHub Pages: over HTTP, from the site's own folder.
        python3 -m http.server --bind 127.0.0.1 --directory build 8765 >/dev/null 2>&1 &
        server=$!
        for _ in $(seq 50); do
          curl -fsS http://127.0.0.1:8765/demo/lantern.json >/dev/null && break
          sleep 0.2
        done
        "$RUNNER_TEMP/venv/bin/python" conformance/run.py --static http://127.0.0.1:8765/demo/ | tee "$RUNNER_TEMP/demo.txt"
        kill "$server"
        grep -q "Lantern Static$" "$RUNNER_TEMP/demo.txt"
      pages_artifact: ${{ github.event_name != 'pull_request' }}

  deploy:
    needs: build
    if: needs.build.outputs.pages_artifact_id != ''
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
