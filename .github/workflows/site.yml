# Lantern's website (site/README.md) on GitHub Pages, its source GitHub
# Actions (Settings › Pages): the protocol's page and the specification
# rendered from SPEC.md, in the fifteen languages of Boréale's sites, its
# drafts as they were published (read from git: the whole history is checked
# out), its French translation, the error types, and the demo library, which
# the conformance suite checks with its trapped variant. Published at each
# push to main touching it, and on demand; a pull request only builds and
# checks it.
name: site

on:
  push:
    branches: [ main ]
    paths: [ "site/**", "SPEC.md", "tools/build_site.py", "tools/check_site.py", "library/boreale-site", ".gitmodules", "tools/requirements.py", "tools/make_demo.py", "tools/requirements.txt", "conformance/**", "server/**", "schemas/**", ".github/workflows/site.yml" ]
  pull_request:
    paths: [ "site/**", "SPEC.md", "tools/build_site.py", "tools/check_site.py", "library/boreale-site", ".gitmodules", "tools/requirements.py", "tools/make_demo.py", "tools/requirements.txt", "conformance/**", "server/**", "schemas/**", ".github/workflows/site.yml" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  PLAYWRIGHT_VERSION: 1.64.0
  AXE_VERSION: 4.13.0
  AXE_SHA256: 096912f6e77b4b695fc9304b7be65091db42d98de054da674ae222a11cb33f70

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The specification's drafts are SPEC.md at their commits (git show): the whole history.
          fetch-depth: 0
          persist-credentials: false
          submodules: true   # library/boreale-site, what Boréale's sites share
      - name: The pages
        run: python3 tools/build_site.py build
      - name: Their links, catalogs and Content-Security-Policy
        run: python3 tools/check_site.py build
      - name: The demo library at Lantern Static, and its trapped variant refused, by the conformance suite
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet -r tools/requirements.txt
          "$RUNNER_TEMP/venv/bin/python" tools/make_demo.py check build/demo
          # As a client reads it on GitHub Pages: over HTTP, from the site's own folder.
          python3 -m http.server --bind 127.0.0.1 --directory build 8765 >/dev/null 2>&1 &
          server=$!
          for _ in $(seq 50); do
            curl -fsS http://127.0.0.1:8765/demo/lantern.json >/dev/null && break
            sleep 0.2
          done
          "$RUNNER_TEMP/venv/bin/python" conformance/run.py --static http://127.0.0.1:8765/demo/ | tee "$RUNNER_TEMP/demo.txt"
          kill "$server"
          grep -q "Lantern Static$" "$RUNNER_TEMP/demo.txt"
      # The runner in the key: the venv holds its Python (3.14 on 26.04)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-venv
          key: playwright-ubuntu-26.04-${{ env.PLAYWRIGHT_VERSION }}
      - name: The pages on phones, a tablet and a desktop
        timeout-minutes: 10
        run: |
          VENV="$HOME/.cache/playwright-venv"
          if [ ! -x "$VENV/bin/python" ]; then
            python3 -m venv "$VENV"
            "$VENV/bin/pip" install -q "playwright==$PLAYWRIGHT_VERSION"
          fi
          sudo "$VENV/bin/python" -m playwright install-deps chromium
          "$VENV/bin/python" -m playwright install chromium
          curl -sfL --retry 3 -o "$RUNNER_TEMP/axe.tgz" "https://registry.npmjs.org/axe-core/-/axe-core-$AXE_VERSION.tgz"
          echo "$AXE_SHA256  $RUNNER_TEMP/axe.tgz" | sha256sum -c --quiet
          python3 -c 'import sys, tarfile; open(sys.argv[2], "wb").write(tarfile.open(sys.argv[1]).extractfile("package/axe.min.js").read())' \
            "$RUNNER_TEMP/axe.tgz" "$RUNNER_TEMP/axe.min.js"
          SITE_AXE="$RUNNER_TEMP/axe.min.js" "$VENV/bin/python" -u library/boreale-site/tools/site_layout.py build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: build
          include-hidden-files: true

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
