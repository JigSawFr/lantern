# The reference server (server/) against the conformance suite
# (conformance/): the unit tests, then the suite run as a server author
# would, against the server started on a tiny fictional library: once
# anonymously on a public server, once with a token holding every scope on a
# private one, paired through its /pair page as a user would, with a device
# key that its requests are signed with (SPEC.md § 5.4). Then a short run of
# the fuzz harness on the server's parsers, another seed each time.
name: conformance

on:
  push:
    branches: [ main ]
    paths: [ "server/**", "conformance/**", "tests/**", "schemas/**", "tools/requirements.txt", "tools/pair_for_ci.py", "tools/requirements.py", "tools/make_vectors.py", "vectors/**", "SPEC.md", ".github/workflows/conformance.yml" ]
  pull_request:
    paths: [ "server/**", "conformance/**", "tests/**", "schemas/**", "tools/requirements.txt", "tools/pair_for_ci.py", "tools/requirements.py", "tools/make_vectors.py", "vectors/**", "SPEC.md", ".github/workflows/conformance.yml" ]

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The schema checker
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet -r tools/requirements.txt
      - name: Unit tests (server and suite)
        run: '"$RUNNER_TEMP/venv/bin/python" -m unittest discover -s tests -v'
      - name: The suite against the reference server, anonymously
        run: |
          python3 tests/library.py "$RUNNER_TEMP/library"
          # The server needs only the standard library: the system Python runs it.
          python3 -m server --library "$RUNNER_TEMP/library" --port 8080 --quiet --discovery &
          for _ in $(seq 50); do
            curl -fsS http://127.0.0.1:8080/.well-known/lantern >/dev/null && break
            sleep 0.2
          done
          # Discovery on its own port, UDP 47115 (SPEC.md § 4.1).
          "$RUNNER_TEMP/venv/bin/python" conformance/run.py http://127.0.0.1:8080/ --discover 127.0.0.1
      - name: The suite against a private reference server, with a token holding every scope
        run: |
          # A fictional account, paired through /pair; the server keeps running in the background.
          token=$(python3 tools/pair_for_ci.py --library "$RUNNER_TEMP/library" --workdir "$RUNNER_TEMP/private" --port 8081)
          echo "::add-mask::$token"
          "$RUNNER_TEMP/venv/bin/python" conformance/run.py http://127.0.0.1:8081/ --token "$token" \
            --key "$RUNNER_TEMP/private/device.key" --admin-writes
      - name: The fuzz harness, a longer run
        run: python3 tests/fuzz.py --iterations 5000 --seed "${{ github.run_id }}"
      - name: The private server's log
        if: failure()
        run: cat "$RUNNER_TEMP/private/server.log" || true
