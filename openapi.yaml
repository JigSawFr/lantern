# Lantern protocol, v1 (SPEC.md). The documents' shapes are the JSON Schemas
# of schemas/v1/, referred to here; SPEC.md is the reference where the two
# would differ. Paths are relative to the base the server announces
# (default /api/lantern), but /.well-known/lantern, at the origin's root.
# Authentication is a bearer token from pairing (SPEC.md § 5), nothing else,
# signed per RFC 9421 when it is bound to the device's key (SPEC.md § 5.4:
# the Signature-Input and Signature headers, described once below);
# discovery (UDP 47115, SPEC.md § 4.1) is not HTTP and is not described here.
# A client names its platform with Lantern-Platform on every call (SPEC.md
# § 4.3); it is described once, as a parameter, on the routes it filters.
openapi: 3.1.0
info:
  title: Lantern protocol
  version: 0.4.0
  summary: An open protocol between homebrews and apps on every platform and self-hosted game library servers.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://shelf.example.org/api/lantern
    description: An example server, its base as announced
security:
  - bearer: []
  - {}
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, description: "A token per device, from pairing (SPEC.md § 5.1, 5.2). A missing, unknown, revoked or expired one gives 401 with WWW-Authenticate: Bearer. A token bound to the device's key (§ 5.4) is sent with Signature-Input and Signature (RFC 9421, label lantern, components @method @target-uri authorization [content-digest], parameters created nonce keyid alg=ed25519); without them, or with a bad, stale or replayed one, 401 with the codes signature_required, signature_invalid, signature_expired or signature_replayed." }
  responses:
    Problem:
      description: "An error (SPEC.md § 12), its title and detail in the client's language (Content-Language, § 2.2): any route may also answer 401 (with WWW-Authenticate: Bearer, and Accept-Signature for a signature), 403, 405 (with Allow), 429, 500 or 503."
      content:
        application/problem+json:
          schema: { $ref: "schemas/v1/problem.json" }
    Apps:
      description: A page of apps.
      content:
        application/json:
          schema: { $ref: "schemas/v1/apps.json" }
    HomebrewPage:
      description: A page of homebrew, without their manifests.
      content:
        application/json:
          schema: { $ref: "schemas/v1/homebrew-page.json" }
    Save:
      description: The backup kept.
      content:
        application/json:
          schema: { $ref: "schemas/v1/save.json" }
    File:
      description: "The whole file (SPEC.md § 6.6)."
      headers: { Repr-Digest: { $ref: "#/components/headers/ReprDigest" }, ETag: { $ref: "#/components/headers/ETag" }, Accept-Ranges: { $ref: "#/components/headers/AcceptRanges" } }
      content: { application/octet-stream: {} }
    FileRange:
      description: "A range of it (SPEC.md § 6.6)."
      headers: { Repr-Digest: { $ref: "#/components/headers/ReprDigest" }, ETag: { $ref: "#/components/headers/ETag" }, Accept-Ranges: { $ref: "#/components/headers/AcceptRanges" } }
      content: { application/octet-stream: {} }
  headers:
    Deprecation:
      description: "Since when the route or schema is deprecated, @<Unix seconds> (RFC 9745; SPEC.md § 3.4). Absent on what is not."
      schema: { type: string, pattern: "^@-?[0-9]{1,15}$" }
    Sunset:
      description: "The HTTP date after which a deprecated route or schema may stop (RFC 8594; SPEC.md § 3.4)."
      schema: { type: string }
    ContentLanguage:
      description: "The language of the texts for people in the document (SPEC.md § 2.2)."
      schema: { type: string }
    ReprDigest:
      description: "sha-256=:<base64>: (RFC 9530), the whole file's digest, on every file response, 200 or 206 (SPEC.md § 6.6)."
      required: true
      schema: { type: string, pattern: "^sha-256=:[A-Za-z0-9+/]{43}=:$" }
    ETag:
      description: A strong ETag.
      required: true
      schema: { type: string }
    AcceptRanges:
      required: true
      schema: { const: bytes }
    UploadOffset:
      description: "How many bytes of the upload the server has (SPEC.md § 9.3)."
      required: true
      schema: { type: integer, minimum: 0 }
  parameters:
    SignatureInput:
      name: Signature-Input
      in: header
      description: "With a token bound to a key (SPEC.md § 5.4): lantern=(\"@method\" \"@target-uri\" \"authorization\" [\"content-digest\"]);created=<s>;nonce=\"<base64url>\";keyid=\"<thumbprint>\";alg=\"ed25519\". On every route; described once here."
      schema: { type: string, maxLength: 1024 }
    Signature:
      name: Signature
      in: header
      description: "lantern=:<base64 of the Ed25519 signature of the signature base>: (RFC 9421; SPEC.md § 5.4)."
      schema: { type: string, maxLength: 1024 }
    AcceptLanguage:
      name: Accept-Language
      in: header
      description: "The language of texts for people: summaries, errors' title and detail, the motd (SPEC.md § 2.2)."
      schema: { type: string }
    AcceptEncoding:
      name: Accept-Encoding
      in: header
      description: "zstd, br or gzip on JSON, which a server should offer; never applied to files (SPEC.md § 2.1)."
      schema: { type: string }
    AdminCursor:
      name: cursor
      in: query
      schema: { type: string }
    Platform:
      name: Lantern-Platform
      in: header
      description: "The client's platform (SPEC.md § 4.3): the server answers for it alone."
      schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,31}$" }
    PlatformQuery:
      name: platform
      in: query
      description: "A platform, overriding Lantern-Platform (SPEC.md § 4.3)."
      schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,31}$" }
    TitleId:
      name: title_id
      in: path
      required: true
      description: "Opaque, of the form its platform's profile gives (SPEC.md § 6.1, Annex A)."
      schema: { type: string, pattern: "^[A-Za-z0-9._-]{1,128}$" }
    TitleIdQuery:
      name: title_id
      in: query
      schema: { type: string, pattern: "^[A-Za-z0-9._-]{1,128}$" }
    HomebrewId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z][a-z0-9_-]*(?:\\.[a-z0-9][a-z0-9_-]*)+$" }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000 }
    Since:
      name: since
      in: query
      schema: { type: string }
    Range:
      name: Range
      in: header
      schema: { type: string }
paths:
  /.well-known/lantern:
    get:
      summary: The handshake, at the origin's root (§ 4.2)
      security: [ {}, { bearer: [] } ]
      responses:
        "200": { description: "The server, its platforms and what it offers this caller.", content: { application/json: { schema: { $ref: "schemas/v1/handshake.json" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /v1/:
    get:
      summary: The handshake (§ 4.2)
      security: [ {}, { bearer: [] } ]
      parameters: [ { $ref: "#/components/parameters/SignatureInput" }, { $ref: "#/components/parameters/Signature" }, { $ref: "#/components/parameters/AcceptLanguage" }, { $ref: "#/components/parameters/AcceptEncoding" } ]
      responses:
        "200": { description: "The server, its platforms and what it offers this caller.", content: { application/json: { schema: { $ref: "schemas/v1/handshake.json" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /v1/pairing:
    post:
      summary: Ask to pair a device, or redeem an invitation (§ 5.2, § 5.5)
      description: "Without a token. The user approves the code on the server's side (its verify page, verify_complete from a QR code, or an admin app), never on the device. With key, the token is bound to it (§ 5.4); a server that issues only bound tokens answers 400 key_required without one. With invitation, the pairing is approved at once; an unknown, expired, revoked or used up invitation gives 410."
      security: [ {} ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "schemas/v1/pairing-request.json" } } } }
      responses:
        "200": { description: "The code to show, verify_complete for a QR code, and where to poll.", content: { application/json: { schema: { $ref: "schemas/v1/pairing-code.json" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "410": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/pairing/{id}:
    get:
      summary: Poll a pairing (§ 5.2)
      description: "A pairing that sent a key polls with requests signed by it, covering @method and @target-uri (§ 5.4); any other poll gets 401."
      security: [ {} ]
      parameters: [ { name: id, in: path, required: true, schema: { type: string } }, { $ref: "#/components/parameters/SignatureInput" }, { $ref: "#/components/parameters/Signature" } ]
      responses:
        "200": { description: "Approved.", content: { application/json: { schema: { $ref: "schemas/v1/pairing-token.json" } } } }
        "202": { description: "Still waiting for the user." }
        "401": { $ref: "#/components/responses/Problem" }
        "410": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/apps:
    get:
      summary: The library, a page at a time (§ 6.2)
      parameters:
        - { $ref: "#/components/parameters/Platform" }
        - { $ref: "#/components/parameters/PlatformQuery" }
        - { name: type, in: query, schema: { type: string, pattern: "^[a-z][a-z0-9_]{0,31}$" } }
        - { $ref: "#/components/parameters/TitleIdQuery" }
        - { name: q, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { enum: [name, added, release] } }
        - { $ref: "#/components/parameters/PageSize" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200": { $ref: "#/components/responses/Apps" }
        "304": { description: "Not modified (If-None-Match)." }
        default: { $ref: "#/components/responses/Problem" }
  /v1/apps/missing:
    post:
      summary: What the device is missing, on its platform (§ 6.3)
      description: "A platform is required: Lantern-Platform or ?platform=, else 400."
      parameters: [ { $ref: "#/components/parameters/Platform" }, { $ref: "#/components/parameters/PlatformQuery" }, { $ref: "#/components/parameters/PageSize" }, { $ref: "#/components/parameters/Cursor" } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "schemas/v1/missing-request.json" } } } }
      responses:
        "200": { $ref: "#/components/responses/Apps" }
        "400": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/changes:
    get:
      summary: What changed since a token (§ 6.4)
      parameters: [ { $ref: "#/components/parameters/Platform" }, { $ref: "#/components/parameters/PlatformQuery" }, { $ref: "#/components/parameters/Since" } ]
      responses:
        "200": { description: "Added and removed apps, and the next token.", content: { application/json: { schema: { $ref: "schemas/v1/changes.json" } } } }
        "410": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/sections:
    get:
      summary: The server's shelves (§ 6.5)
      parameters: [ { $ref: "#/components/parameters/Platform" } ]
      responses:
        "200": { description: "Sections.", content: { application/json: { schema: { $ref: "schemas/v1/sections.json" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /v1/files/{id}:
    get:
      summary: A file, with ranges (§ 6.6)
      parameters: [ { name: id, in: path, required: true, schema: { type: string } }, { $ref: "#/components/parameters/Range" } ]
      responses:
        "200": { $ref: "#/components/responses/File" }
        "206": { $ref: "#/components/responses/FileRange" }
        "410": { $ref: "#/components/responses/Problem" }
        "416": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/titles:
    get:
      summary: Many titles at once, 100 at most (§ 7.2)
      parameters:
        - { $ref: "#/components/parameters/Platform" }
        - { $ref: "#/components/parameters/PlatformQuery" }
        - { name: ids, in: query, required: true, description: "Title ids, comma-separated, 100 at most.", schema: { type: string } }
      responses:
        "200": { description: "The titles known, and the ids unknown.", content: { application/json: { schema: { $ref: "schemas/v1/titles.json" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/titles/changes:
    get:
      summary: The titles changed since a token (§ 7.3)
      parameters: [ { $ref: "#/components/parameters/Platform" }, { $ref: "#/components/parameters/PlatformQuery" }, { $ref: "#/components/parameters/Since" } ]
      responses:
        "200": { description: "Titles added or changed, removed, and the next token.", content: { application/json: { schema: { $ref: "schemas/v1/title-changes.json" } } } }
        "410": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/titles/{title_id}:
    get:
      summary: A game's sheet on one platform (§ 7.1)
      parameters: [ { $ref: "#/components/parameters/TitleId" }, { $ref: "#/components/parameters/Platform" }, { $ref: "#/components/parameters/PlatformQuery" } ]
      responses:
        "200": { description: "The title.", content: { application/json: { schema: { $ref: "schemas/v1/title.json" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /v1/homebrew:
    get:
      summary: The homebrew, a page at a time (§ 8.5)
      parameters:
        - { $ref: "#/components/parameters/Platform" }
        - { $ref: "#/components/parameters/PlatformQuery" }
        - { name: q, in: query, schema: { type: string } }
        - { name: kind, in: query, description: "Only this kind (app, game, port, emulator, tool, overlay, sysmodule, theme; § 8.1). Not a lower-case word: 400; unknown: an empty page.", schema: { type: string, pattern: "^[a-z][a-z0-9_]{0,31}$" } }
        - { name: genre, in: query, description: "Only the entries whose genres hold it (the titles' list, § 7.1). Not a lower-case word: 400; unknown: an empty page.", schema: { type: string, pattern: "^[a-z][a-z0-9_]{0,31}$" } }
        - { $ref: "#/components/parameters/PageSize" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200": { $ref: "#/components/responses/HomebrewPage" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/homebrew/updates:
    post:
      summary: The newer builds of what is installed (§ 8.5)
      description: "A platform is required: Lantern-Platform or ?platform=, else 400."
      parameters: [ { $ref: "#/components/parameters/Platform" }, { $ref: "#/components/parameters/PlatformQuery" }, { $ref: "#/components/parameters/PageSize" }, { $ref: "#/components/parameters/Cursor" } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "schemas/v1/homebrew-updates-request.json" } } } }
      responses:
        "200": { $ref: "#/components/responses/HomebrewPage" }
        "400": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/homebrew/{id}:
    get:
      summary: A homebrew, with its manifest (§ 8.1)
      parameters: [ { $ref: "#/components/parameters/HomebrewId" }, { $ref: "#/components/parameters/Platform" }, { $ref: "#/components/parameters/PlatformQuery" } ]
      responses:
        "200": { description: "The entry.", content: { application/json: { schema: { $ref: "schemas/v1/homebrew.json" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /v1/saves:
    get:
      summary: The account's save backups (§ 9.1)
      parameters: [ { $ref: "#/components/parameters/Platform" }, { $ref: "#/components/parameters/PlatformQuery" }, { $ref: "#/components/parameters/TitleIdQuery" } ]
      responses:
        "200": { description: "Save backups.", content: { application/json: { schema: { $ref: "schemas/v1/saves.json" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /v1/saves/{title_id}:
    post:
      summary: Send a save backup in one request, up to limits.save_body (§ 9.2)
      parameters:
        - { $ref: "#/components/parameters/TitleId" }
        - { $ref: "#/components/parameters/Platform" }
        - { $ref: "#/components/parameters/PlatformQuery" }
        - { name: Content-Digest, in: header, required: true, description: "sha-256=:<base64>: (RFC 9530), checked by the server.", schema: { type: string } }
        - { name: Lantern-Save-Kind, in: header, schema: { enum: [account, device, bcat, cache, other] } }
        - { name: Lantern-Save-Slot, in: header, description: "Which of the title's save folders, where it has several (SPEC.md § 9.1).", schema: { type: string, pattern: "^[A-Za-z0-9._-]{1,64}$" } }
        - { name: Lantern-Game-Version, in: header, description: "The game's version_code.", schema: { type: integer, minimum: 0 } }
        - { name: Lantern-Profile, in: header, description: "UTF-8, percent-encoded, 64 bytes at most.", schema: { type: string } }
        - { name: Lantern-Note, in: header, description: "UTF-8, percent-encoded, 120 bytes at most.", schema: { type: string } }
      requestBody: { required: true, content: { application/zip: {} } }
      responses:
        "201": { $ref: "#/components/responses/Save" }
        "400": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/saves/{title_id}/uploads:
    post:
      summary: Open a resumable upload of a save (§ 9.3)
      parameters: [ { $ref: "#/components/parameters/TitleId" }, { $ref: "#/components/parameters/Platform" }, { $ref: "#/components/parameters/PlatformQuery" } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "schemas/v1/upload-request.json" } } } }
      responses:
        "201": { description: "Where to send the chunks, and their size.", content: { application/json: { schema: { $ref: "schemas/v1/upload.json" } } } }
        "413": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/uploads/{id}:
    description: "The address an upload's opening gave (SPEC.md § 9.3); a server may choose another, which the client uses as given."
    parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
    head:
      summary: Where the upload stands (§ 9.3)
      responses:
        "204": { description: "Its offset and length.", headers: { Upload-Offset: { $ref: "#/components/headers/UploadOffset" }, Upload-Length: { schema: { type: integer } } } }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      summary: Send a chunk at the server's offset (§ 9.3)
      parameters:
        - { name: Upload-Offset, in: header, required: true, schema: { type: integer, minimum: 0 } }
        - { name: Content-Digest, in: header, description: "The chunk's own digest, optional, checked when sent.", schema: { type: string } }
      requestBody: { required: true, content: { application/offset+octet-stream: {} } }
      responses:
        "204": { description: "Kept.", headers: { Upload-Offset: { $ref: "#/components/headers/UploadOffset" } } }
        "201": { $ref: "#/components/responses/Save" }
        "409": { description: "Not the server's offset (code conflict).", headers: { Upload-Offset: { $ref: "#/components/headers/UploadOffset" } }, content: { application/problem+json: { schema: { $ref: "schemas/v1/problem.json" } } } }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      summary: Abandon an upload (§ 9.3)
      responses:
        "204": { description: "Abandoned." }
        default: { $ref: "#/components/responses/Problem" }
  /v1/saves/{title_id}/{save_id}:
    parameters: [ { $ref: "#/components/parameters/TitleId" }, { name: save_id, in: path, required: true, schema: { type: string } } ]
    get:
      summary: Download a save backup (§ 9.1)
      parameters: [ { $ref: "#/components/parameters/Range" } ]
      responses:
        "200": { description: "The zip archive, as a file (§ 6.6).", headers: { Repr-Digest: { $ref: "#/components/headers/ReprDigest" } }, content: { application/zip: {} } }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      summary: Delete a save backup (§ 9.1)
      responses:
        "204": { description: "Deleted." }
        default: { $ref: "#/components/responses/Problem" }
  /v1/cheats:
    get:
      summary: The cheat sets (§ 10)
      parameters: [ { $ref: "#/components/parameters/Platform" }, { $ref: "#/components/parameters/PlatformQuery" }, { $ref: "#/components/parameters/TitleIdQuery" }, { name: build_id, in: query, schema: { type: string, pattern: "^[A-Za-z0-9._-]{1,64}$" } } ]
      responses:
        "200": { description: "Cheat sets.", content: { application/json: { schema: { $ref: "schemas/v1/cheats.json" } } } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      summary: Add a cheat set (§ 10, scope cheats.write; optional, 405 without)
      parameters: [ { $ref: "#/components/parameters/Platform" } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "schemas/v1/cheat-write.json" } } } }
      responses:
        "201": { description: "Added: the new set.", content: { application/json: { schema: { $ref: "schemas/v1/cheat.json" } } } }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/cheats/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
    get:
      summary: A cheat set's text, as a file (§ 10)
      parameters: [ { $ref: "#/components/parameters/Platform" } ]
      responses:
        "200": { description: "Its text, in the platform's own format (SPEC.md Annex A).", headers: { Repr-Digest: { $ref: "#/components/headers/ReprDigest" } }, content: { text/plain: {} } }
        default: { $ref: "#/components/responses/Problem" }
    put:
      summary: Replace a cheat set (§ 10, scope cheats.write; optional, 405 without)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "schemas/v1/cheat-write.json" } } } }
      responses:
        "204": { description: "Written." }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      summary: Delete a cheat set (§ 10, scope cheats.write; optional, 405 without)
      responses:
        "204": { description: "Deleted." }
        default: { $ref: "#/components/responses/Problem" }
  /v1/requests:
    get:
      summary: The account's requests (§ 11)
      responses:
        "200": { description: "Requests.", content: { application/json: { schema: { $ref: "schemas/v1/requests.json" } } } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      summary: Ask for a game (§ 11)
      parameters: [ { $ref: "#/components/parameters/Platform" } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "schemas/v1/request-create.json" } } } }
      responses:
        "200": { description: "The open request for the same title.", content: { application/json: { schema: { $ref: "schemas/v1/request.json" } } } }
        "201": { description: "Asked: the new request.", content: { application/json: { schema: { $ref: "schemas/v1/request.json" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /v1/requests/{id}:
    delete:
      summary: Withdraw one's own request (§ 11)
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        "204": { description: "Withdrawn." }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/admin/users:
    get:
      summary: The accounts (§ 5.7, scope admin)
      parameters: [ { $ref: "#/components/parameters/PageSize" }, { $ref: "#/components/parameters/AdminCursor" } ]
      responses:
        "200": { description: "A page of accounts.", content: { application/json: { schema: { $ref: "schemas/v1/admin-users.json" } } } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      summary: Make an account, without a password (§ 5.7)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "schemas/v1/admin-user-create.json" } } } }
      responses:
        "201": { description: "The account.", content: { application/json: { schema: { $ref: "schemas/v1/admin-user.json" } } } }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/admin/users/{name}:
    patch:
      summary: Freeze or thaw an account, or change its scopes (§ 5.7)
      parameters: [ { name: name, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9._-]{1,64}$" } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "schemas/v1/admin-user-update.json" } } } }
      responses:
        "200": { description: "The account.", content: { application/json: { schema: { $ref: "schemas/v1/admin-user.json" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /v1/admin/devices:
    get:
      summary: The paired devices, one token each (§ 5.7)
      parameters: [ { name: user, in: query, schema: { type: string } }, { $ref: "#/components/parameters/PageSize" }, { $ref: "#/components/parameters/AdminCursor" } ]
      responses:
        "200": { description: "A page of devices.", content: { application/json: { schema: { $ref: "schemas/v1/admin-devices.json" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /v1/admin/devices/{id}:
    delete:
      summary: Revoke a device's token (§ 5.7)
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        "204": { description: "Revoked: the token gives 401 from now on." }
        default: { $ref: "#/components/responses/Problem" }
  /v1/admin/pairings:
    get:
      summary: The pairings waiting for approval (§ 5.7)
      parameters: [ { $ref: "#/components/parameters/PageSize" }, { $ref: "#/components/parameters/AdminCursor" } ]
      responses:
        "200": { description: "A page of pairings.", content: { application/json: { schema: { $ref: "schemas/v1/admin-pairings.json" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /v1/admin/pairings/{id}:
    post:
      summary: Approve or refuse a waiting pairing (§ 5.7)
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "schemas/v1/admin-pairing-decision.json" } } } }
      responses:
        "204": { description: "Decided: the device's poll gives its token, or 410." }
        default: { $ref: "#/components/responses/Problem" }
  /v1/admin/invitations:
    get:
      summary: The invitations that can still be redeemed (§ 5.5, § 5.7)
      parameters: [ { $ref: "#/components/parameters/PageSize" }, { $ref: "#/components/parameters/AdminCursor" } ]
      responses:
        "200": { description: "A page of invitations.", content: { application/json: { schema: { $ref: "schemas/v1/invitations.json" } } } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      summary: Make an invitation (§ 5.5)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "schemas/v1/invitation-create.json" } } } }
      responses:
        "201": { description: "The invitation, its code and its link.", content: { application/json: { schema: { $ref: "schemas/v1/invitation.json" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /v1/admin/invitations/{id}:
    delete:
      summary: Revoke an invitation (§ 5.5)
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        "204": { description: "Revoked: its code gives 410." }
        default: { $ref: "#/components/responses/Problem" }
