<section class="wrap hero hero-home">
    <div class="hero-text">
      <p class="pill"><a href="{{root}}spec/changes/">{{hero_eyebrow}}</a><a class="pill-more" href="{{root}}spec/changes/">{{hero_changes}}</a></p>
      <h1>{{hero_title}}</h1>
      <p class="sub">{{hero_sub_parts}}</p>
      <p class="lede">{{hero_lede}}</p>
      <div class="actions">
        <a class="button primary" href="{{root}}{{home}}spec/">{{cta_spec}}</a>
        <a class="button" href="{{root}}{{home}}demo/">{{cta_demo}}</a>
      </div>
      <p class="source">{{status_text}} <a href="{{repo}}">{{cta_github}}</a></p>
    </div>
    <!-- The flow the protocol carries, drawn in snow on the night: the
         server at home, Lantern's versioned JSON with each file's SHA-256,
         the consoles and apps that read it. Its texts are the catalog's; the
         wires move only where motion is welcome (site.css). -->
    <figure class="flow" aria-labelledby="flow-title">
      <figcaption id="flow-title" class="sr">{{flow_title}}</figcaption>
      <div class="flow-node flow-server">
        <span class="flow-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01M11 7h6M11 17h6"/></svg></span>
        <span class="flow-text"><strong>{{flow_server}}</strong><small>{{flow_server_note}}</small></span>
      </div>
      <div class="flow-link" aria-hidden="true"><span class="flow-wire"></span><code>GET /api/lantern/v1/apps</code></div>
      <div class="flow-node flow-core">
        <img src="{{root}}assets/marks/lantern.svg" alt="" width="64" height="64">
        <span class="flow-text"><strong>Lantern</strong><small>{{flow_core_note}}</small></span>
        <pre class="flow-json" aria-hidden="true"><code>{ <span class="k">"schema"</span>: 1,
  <span class="k">"name"</span>: <span class="s">"Frostline Tales"</span>,
  <span class="k">"sha256"</span>: <span class="s">"3a7bd3e2…"</span>, … }</code></pre>
      </div>
      <div class="flow-link" aria-hidden="true"><span class="flow-wire"></span><code>sha256 ✓</code></div>
      <div class="flow-node flow-clients">
        <span class="flow-devices" aria-hidden="true">
          <span class="flow-icon"><svg viewBox="0 0 24 24"><rect x="1.5" y="6.5" width="21" height="11" rx="3.5"/><rect x="6.5" y="8.5" width="11" height="7" rx="1"/><path d="M4 10.5h.01M20 13.5h.01"/></svg></span>
          <span class="flow-icon"><svg viewBox="0 0 24 24"><rect x="5" y="2.5" width="14" height="8.5" rx="2"/><rect x="5" y="13" width="14" height="8.5" rx="2"/><path d="M8 5h8v4H8zM9 17.5h.01M15 17.5h.01"/></svg></span>
          <span class="flow-icon"><svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.2"/><path d="M11 18.5h2"/></svg></span>
          <span class="flow-icon"><svg viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="16" rx="2.2"/><path d="M2.5 8.5h19M5.5 6.25h.01M8 6.25h.01"/></svg></span>
        </span>
        <span class="flow-text"><strong>{{flow_client}}</strong><small>{{flow_client_note}}</small></span>
      </div>
    </figure>
  </section>
