  <section class="section">
    <p class="note">{{check_note}}</p>
    <form id="check-form" class="check-form" hidden
          data-ok="{{check_ok}}" data-bad="{{check_bad}}" data-not-json="{{check_not_json}}"
          data-failed="{{check_failed}}" data-newer="{{check_newer}}">
      <label for="check-kind">{{check_kind}}</label>
      <select id="check-kind" name="kind">{{check_options}}</select>
      <label for="check-doc">{{check_doc}}</label>
      <textarea id="check-doc" name="doc" rows="16" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
      <div class="check-buttons">
        <button type="submit" class="button">{{check_run}}</button>
        <button type="button" id="check-sample" class="button ghost" hidden>{{check_sample}}</button>
      </div>
    </form>
    <noscript><p class="note">{{check_noscript}}</p></noscript>
    <div id="check-result" class="check-result" role="status" aria-live="polite"></div>
  </section>
