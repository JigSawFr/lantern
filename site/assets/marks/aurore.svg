  <rect x="42" y="42" width="172" height="172" rx="34" fill="#0E1A33" stroke="url(#colour)" stroke-width="16"/>
  <g clip-path="url(#pane)">
    <path d="M40 150 C 80 132, 120 150, 150 128 S 196 100, 216 104" fill="none" stroke="url(#colour)" stroke-width="10" stroke-linecap="round"/>
    <path d="M40 216 L 40 190 L 84 150 L 106 170 L 140 132 L 186 180 L 216 160 L 216 216 Z" fill="#E8EEF7"/>
  </g>
  <circle cx="86" cy="86" r="5" fill="#E8EEF7"/><circle cx="160" cy="78" r="3.5" fill="#E8EEF7"/><circle cx="186" cy="96" r="3" fill="#E8EEF7"/>
